<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI主数据智能治理平台 · 企业演示版</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#1a56db;--pl:#3b82f6;--a:#06b6d4;--s:#10b981;--w:#f59e0b;
  --d:#ef4444;--pu:#8b5cf6;--bg:#0f172a;--bg2:#1e293b;--bg3:#334155;
  --t:#f1f5f9;--t2:#94a3b8;--t3:#64748b;--bd:#334155;--r:12px;
}
html,body{height:100%}
body{font-family:'Segoe UI','Microsoft YaHei',PingFang SC,Helvetica,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;font-size:13px;line-height:1.5}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
.nav{background:linear-gradient(135deg,#0f2044,#0f172a);border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;backdrop-filter:blur(8px)}
.logo{display:flex;align-items:center;gap:12px}.logo-i{width:40px;height:40px;background:linear-gradient(135deg,var(--p),var(--a));border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#fff}
.logo-t h1{font-size:16px;font-weight:800;color:#fff}.logo-t p{font-size:10px;color:var(--t3);letter-spacing:1.2px}
.nav-right{display:flex;align-items:center;gap:14px}
.engine-status{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--s);background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);padding:6px 12px;border-radius:20px}
.engine-status.idle{color:var(--t3);background:rgba(148,163,184,.06);border-color:rgba(148,163,184,.2)}
.engine-status .dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
.view-switch{width:126px;padding:6px 8px;background:var(--bg);border:1px solid var(--bd);border-radius:7px;color:var(--t2);font-size:11px;outline:none}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 currentColor}50%{opacity:.7;box-shadow:0 0 0 6px transparent}}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{padding:7px 12px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--t2);transition:.15s;border:none;background:0;font-family:inherit}
.tab:hover{background:var(--bg2);color:var(--t)}.tab.on{background:var(--p);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(26,86,219,.4)}
.wrap{max-width:1440px;margin:0 auto;padding:18px 24px}
.page{display:none;animation:fadein .25s ease}.page.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.card-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-title .icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px}
.card-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{padding:7px 14px;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--p),var(--pl));color:#fff}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px rgba(26,86,219,.35)}
.btn-secondary{background:var(--bg);border:1px solid var(--bd);color:var(--t2)}
.btn-secondary:hover:not(:disabled){border-color:var(--p);color:var(--pl)}
.btn-success{background:linear-gradient(135deg,#059669,#10b981);color:#fff}
.btn-warn{background:linear-gradient(135deg,#d97706,#f59e0b);color:#fff}
.btn-danger{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff}
.btn-ghost{background:transparent;color:var(--t2);border:1px dashed var(--bd)}
.btn-ghost:hover:not(:disabled){color:var(--t);border-color:var(--t2)}
.btn-sm{padding:4px 9px;font-size:11px}.btn-lg{padding:10px 18px;font-size:13px}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.3px;line-height:1.5}
.tag-merge{background:rgba(6,182,212,.15);color:#22d3ee;border:1px solid rgba(6,182,212,.3)}
.tag-warn{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.3)}
.tag-new{background:rgba(139,92,246,.15);color:#c084fc;border:1px solid rgba(139,92,246,.3)}
.tag-ok{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.3)}
.tag-err{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3)}
.tag-info{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3)}
.tag-muted{background:rgba(148,163,184,.1);color:var(--t2);border:1px solid rgba(148,163,184,.2)}
.input,.select,.textarea{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:7px;color:var(--t);font-size:12px;outline:none;font-family:inherit;transition:.15s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--p)}.textarea{min-height:60px;resize:vertical}
.input-search{position:relative}.input-search::before{content:'🔍';position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.5}
.input-search input{padding-left:34px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;max-height:520px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12px}thead{position:sticky;top:0;background:var(--bg2);z-index:5}
th{padding:10px;text-align:left;font-weight:700;color:var(--t2);font-size:11px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid rgba(51,65,85,.4);vertical-align:top}
tbody tr:hover{background:var(--bg3)}tbody tr.clickable{cursor:pointer}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi.k-blue::before{background:linear-gradient(90deg,var(--pl),var(--p))}
.kpi.k-green::before{background:linear-gradient(90deg,#34d399,var(--s))}
.kpi.k-amber::before{background:linear-gradient(90deg,#fbbf24,var(--w))}
.kpi.k-cyan::before{background:linear-gradient(90deg,#22d3ee,var(--a))}
.kpi.k-violet::before{background:linear-gradient(90deg,#a78bfa,var(--pu))}
.kpi.k-rose::before{background:linear-gradient(90deg,#f87171,var(--d))}
.kpi-label{font-size:11px;color:var(--t2);margin-bottom:4px}.kpi-value{font-size:22px;font-weight:800;line-height:1.1}
.kpi-sub{font-size:10px;color:var(--t3);margin-top:3px}.kpi-emoji{position:absolute;right:14px;top:12px;font-size:20px;opacity:.15}
.upload-zone{border:2px dashed var(--bd);border-radius:var(--r);padding:48px 36px;text-align:center;transition:.2s;cursor:pointer;position:relative;background:linear-gradient(180deg,rgba(26,86,219,.03),transparent)}
.upload-zone:hover{border-color:var(--p);background:rgba(26,86,219,.07);transform:translateY(-1px);box-shadow:0 4px 16px rgba(26,86,219,.15)}
.upload-zone.drag{border-color:var(--a);background:rgba(6,182,212,.1);box-shadow:0 0 0 3px rgba(6,182,212,.2)}
.upload-zone .ic{font-size:48px;opacity:.5;margin-bottom:10px;transition:.2s}
.upload-zone:hover .ic{opacity:.85;transform:scale(1.05)}
.upload-zone .t1{font-size:15px;color:var(--t);margin-bottom:6px;font-weight:600}
.upload-zone .t2{font-size:11px;color:var(--t3)}
.upload-zone input[type="file"]{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer}
.progress{margin:14px 0;padding:14px;background:var(--bg);border-radius:10px;border:1px solid var(--bd);display:none}
.progress.show{display:block}
.progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px}
.progress-row .count{font-weight:700;color:var(--pl)}
.progress-bar{background:var(--bg3);border-radius:6px;height:18px;overflow:hidden;position:relative}
.progress-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--p),var(--pl));transition:width .3s ease;width:0}
.progress-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.progress-status{margin-top:6px;font-size:11px;color:var(--t3)}
.pipeline{display:grid;grid-template-columns:repeat(var(--workflow-count,1),minmax(110px,1fr));gap:6px;margin:14px 0;overflow-x:auto;padding-bottom:2px}
.step{min-width:110px;min-height:68px;text-align:center;padding:8px 6px;border-radius:8px;font-size:10px;background:var(--bg);border:1px solid var(--bd);color:var(--t3);transition:.2s;display:flex;flex-direction:column;justify-content:center}
.step.done{background:rgba(16,185,129,.1);border-color:var(--s);color:var(--s)}
.step.cur{background:rgba(26,86,219,.15);border-color:var(--p);color:var(--pl);font-weight:700;animation:glow 1.2s infinite}
.step.action{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.7);color:var(--w)}
.step.ready{background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.55);color:#93c5fd}
.step.waiting{background:var(--bg);border-color:var(--bd);color:var(--t3)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(26,86,219,.3)}50%{box-shadow:0 0 10px 1px rgba(26,86,219,.2)}}
.step .num{font-size:13px;font-weight:800;display:block;margin-bottom:1px}
.step .step-label{display:block;line-height:1.3;color:inherit}
.step .step-status{display:block;margin-top:4px;font-size:9px;color:inherit;opacity:.78}
@media(max-width:760px){.pipeline{grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible}.step{min-width:0}}
.empty{padding:48px 24px;text-align:center;color:var(--t3)}
.empty .ic{font-size:48px;opacity:.4;margin-bottom:10px}
.empty .title{font-size:14px;font-weight:600;color:var(--t);margin-bottom:6px}
.empty .desc{font-size:11px;opacity:.7;max-width:420px;margin:0 auto}
.review-card{background:var(--bg);border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;padding:14px}
.review-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.review-meta{flex:1;min-width:0}
.review-name{font-size:13px;font-weight:700;margin-bottom:4px;word-break:break-all}
.review-code{font-family:Consolas,monospace;font-size:11px;color:var(--a);font-weight:700;margin-bottom:6px}
.review-desc{font-size:11px;color:var(--t2);margin-bottom:6px;line-height:1.6}
.review-reason{font-size:11px;color:var(--w);background:rgba(245,158,11,.08);padding:6px 10px;border-radius:6px;border-left:3px solid var(--w);margin:6px 0}
.review-conf{display:flex;align-items:center;gap:10px}
.confidence-ring{position:relative;width:50px;height:50px;flex-shrink:0}
.confidence-ring svg{transform:rotate(-90deg)}
.confidence-ring .bg{fill:none;stroke:var(--bd);stroke-width:4}
.confidence-ring .fg{fill:none;stroke-width:4;stroke-linecap:round}
.confidence-ring .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.review-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.review-actions .btn{flex:1;min-width:80px;justify-content:center}
.review-detail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd)}
.review-detail summary{cursor:pointer;font-size:11px;color:var(--t2);user-select:none;padding:4px 0}
.review-detail summary:hover{color:var(--pl)}
.review-detail table{margin-top:8px;font-size:11px}
.q-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px}
.q-card{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.q-ring{position:relative;width:56px;height:56px;flex-shrink:0}
.q-ring svg{transform:rotate(-90deg)}
.q-ring .bg{fill:none;stroke:var(--bd);stroke-width:5}
.q-ring .fg{fill:none;stroke-width:5;stroke-linecap:round}
.q-ring .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.q-info{flex:1;min-width:0}
.q-name{font-size:13px;font-weight:700;margin-bottom:3px}
.q-dim{font-size:11px;color:var(--t3)}
.q-list{margin-top:8px}
.q-item{padding:8px 12px;border-radius:6px;margin-bottom:6px;font-size:11px;border-left:3px solid var(--bd);background:var(--bg)}
.q-item.high{border-color:var(--d);background:rgba(239,68,68,.05)}
.q-item.mid{border-color:var(--w);background:rgba(245,158,11,.05)}
.q-item.low{border-color:var(--pl);background:rgba(59,130,246,.05)}
.q-item .q-act{color:var(--t2);font-size:11px;margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:960px){.two{grid-template-columns:1fr}}
.chart-card{background:linear-gradient(180deg,var(--bg2),rgba(30,41,59,.55));border:1px solid var(--bd);border-radius:12px;padding:16px 18px;position:relative;transition:.2s;overflow:hidden;min-height:240px}
.chart-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pl),var(--a),var(--s));opacity:.7}
.chart-card .chart-svg{max-height:220px}
.chart-title{font-size:13px;color:var(--t);margin-bottom:10px;font-weight:700;display:flex;align-items:center;gap:8px}
.chart-title .badge{padding:3px 10px;border-radius:12px;background:rgba(59,130,246,.15);color:var(--pl);font-size:11px;font-weight:700}
.chart-svg{width:100%;height:auto;display:block;min-height:180px}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}
.chart-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--t2);justify-content:center;padding:8px 0}
.chart-legend .lg{display:flex;align-items:center;gap:6px;background:var(--bg);padding:4px 10px;border-radius:4px}
.chart-legend .lg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
@media(max-width:960px){.chart-grid{grid-template-columns:1fr}}
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--bd)}
.tl-item{position:relative;margin-bottom:14px;padding-left:14px}
.tl-item::before{content:'';position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--p);border:2px solid var(--bg2);box-sizing:border-box}
.tl-item.ok::before{background:var(--s)}.tl-item.reject::before{background:var(--d)}.tl-item.pending::before{background:var(--w)}
.tl-time{font-size:10px;color:var(--t3);margin-bottom:2px}.tl-text{font-size:12px;color:var(--t)}.tl-meta{font-size:11px;color:var(--t2);margin-top:3px}
.lc-steps{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px;padding:14px;background:var(--bg);border-radius:10px}
.lc-step{padding:10px 14px;border-radius:8px;background:var(--bg2);border:1px solid var(--bd);font-size:11px;color:var(--t2);text-align:center;flex:1;min-width:90px}
.lc-step.ok{background:rgba(16,185,129,.1);border-color:var(--s);color:var(--s)}
.lc-step.cur{background:rgba(26,86,219,.15);border-color:var(--p);color:var(--pl);font-weight:700}
.lc-step.reject{background:rgba(239,68,68,.1);border-color:var(--d);color:var(--d)}
.lc-step .num{display:block;font-size:14px;font-weight:800;margin-bottom:1px}
.lc-arrow{color:var(--t3);font-size:14px}
.role-tabs{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:4px;margin-bottom:12px;width:fit-content}
.role-tab{padding:6px 14px;border-radius:6px;font-size:11px;color:var(--t2);cursor:pointer;border:none;background:0;font-family:inherit}
.role-tab.on{background:var(--p);color:#fff;font-weight:600}
.dist-target-list{display:flex;flex-direction:column;gap:6px}
.dist-target{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border-radius:6px;border:1px solid var(--bd)}
.dist-target input{margin:0}.dist-target .sys-name{flex:1;font-size:12px}.dist-target .sys-stats{font-size:10px;color:var(--t3)}
.dist-collab{display:grid;grid-template-columns:1.4fr repeat(3,1fr);margin-top:16px;padding-top:14px;border-top:1px solid var(--bd)}
.dist-collab-item{min-width:0;padding:0 14px;border-right:1px solid var(--bd)}
.dist-collab-item:first-child{padding-left:0}.dist-collab-item:last-child{border-right:0;padding-right:0}
.dist-collab-label{font-size:10px;color:var(--t3);margin-bottom:4px}.dist-collab-value{font-size:18px;font-weight:800;color:var(--t);overflow-wrap:anywhere}
.dist-collab-value.route{font-size:13px;color:var(--a);line-height:1.4}.dist-collab-note{font-size:10px;color:var(--t3);margin-top:2px}
@media(max-width:760px){.dist-collab{grid-template-columns:repeat(2,1fr);gap:12px}.dist-collab-item{padding:0 10px;border-right:0}.dist-collab-item:first-child{padding-left:10px}}
.dist-log{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:8px;margin-bottom:6px;font-size:11px}
.dist-log .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dist-log .dot.ok{background:var(--s)}.dist-log .dot.err{background:var(--d)}.dist-log .dot.pending{background:var(--w)}
.dist-log .info{flex:1;min-width:0;word-break:break-all}.dist-log .time{color:var(--t3);font-size:10px;flex-shrink:0}
.kb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.kb-stat{padding:14px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;position:relative;overflow:hidden}
.kb-stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kb-stat.k1::before{background:var(--pl)}.kb-stat.k2::before{background:var(--s)}.kb-stat.k3::before{background:var(--w)}.kb-stat.k4::before{background:var(--a)}.kb-stat.k5::before{background:var(--pu)}.kb-stat.k6::before{background:var(--d)}
.kb-stat .lbl{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kb-stat .val{font-size:24px;font-weight:800}.kb-stat .hit{font-size:10px;color:var(--s);margin-top:2px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:22px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto}
.modal-title{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.modal-title .close{cursor:pointer;color:var(--t2);font-size:18px;padding:0 6px}.modal-title .close:hover{color:var(--t)}
#toast-wrap{position:fixed;top:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{padding:10px 14px;border-radius:8px;font-size:12px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:slidein .25s ease;display:flex;align-items:center;gap:8px}
.toast.success{background:#059669;color:#fff}.toast.error{background:#dc2626;color:#fff}.toast.warn{background:#d97706;color:#fff}.toast.info{background:var(--p);color:#fff}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.field-mapping{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}
.field-map-item{padding:10px;background:var(--bg);border:1px solid var(--bd);border-radius:8px}
.field-map-item .raw{font-size:11px;color:var(--t3);margin-bottom:4px;font-family:Consolas,monospace;word-break:break-all}

<script>
/* ============================================================
   AI 主数据智能治理平台 · 企业演示版
   Flask + SQLite 为权威数据源，IndexedDB 仅用于页面缓存
   ============================================================ */

"use strict";

/* ===================== 工具函数 ===================== */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
const fmtPct = (x) => (Math.round((Number(x)||0) * 1000) / 10).toFixed(1) + "%";
const fmtNum = (x) => (Number(x) || 0).toLocaleString("zh-CN");
const fmtDate = (ts) => {
  if(!ts) return "";
  const d = new Date(ts);
  return d.toLocaleString("zh-CN", { hour12: false });
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
let lastToastKey = "", lastToastAt = 0;

function toast(msg, type="info", timeout=2800){
  const toastKey = `${type}:${msg}`;
  const now = Date.now();
  if(toastKey === lastToastKey && now - lastToastAt < 1800) return;
  lastToastKey = toastKey;
  lastToastAt = now;
  const wrap = $("#toast-wrap");
  const el = document.createElement("div");
  el.className = "toast " + type;
  const icons = { success:"✓", error:"✕", warn:"⚠", info:"ℹ" };
  el.innerHTML = `<span>${icons[type] || "ℹ"}</span><span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transform = "translateX(20px)"; setTimeout(() => el.remove(), 200); }, timeout);
}

function showModal(html, onMount){
  const ov = $("#modalOverlay"), mb = $("#modalBody");
  mb.innerHTML = html;
  ov.classList.add("show");
  mb.querySelectorAll(".close, [data-close]").forEach(el => el.addEventListener("click", () => ov.classList.remove("show")));
  if(typeof onMount === "function") onMount(mb);
}
function hideModal(){ $("#modalOverlay").classList.remove("show"); }

/* ===================== Flask API ===================== */
const API_BASE = "/api";

async function apiRequest(path, options={}){
  const config = { credentials:"same-origin", ...options };
  const headers = new Headers(config.headers || {});
  if(config.body && !(config.body instanceof FormData) && !headers.has("Content-Type")){
    headers.set("Content-Type", "application/json");
  }
  config.headers = headers;
  let response;
  try {
    response = await fetch(API_BASE + path, config);
  } catch(error){
    if(typeof STATE !== "undefined") STATE.backendOnline = false;
    const hint = location.protocol === "file:"
      ? "请双击 start.bat 启动平台，不要直接打开 index.html。"
      : "Flask 后端连接中断，系统正在自动重连。";
    throw new Error(hint);
  }
  const payload = await response.json().catch(() => ({}));
  if(!response.ok){
    throw new Error(payload.error || `Flask API 请求失败（HTTP ${response.status}）`);
  }
  return payload;
}

let backendReconnectTimer = null;
function scheduleBackendReconnect(){
  if(backendReconnectTimer) return;
  backendReconnectTimer = setInterval(async () => {
    try {
      await apiRequest("/health");
      clearInterval(backendReconnectTimer);
      backendReconnectTimer = null;
      await loadServerState();
      toast("Flask 后端已恢复连接", "success");
      render();
    } catch(_error){ /* keep cached UI and retry quietly */ }
  }, 4000);
}

function serverTime(value){
  if(!value) return Date.now();
  const parsed = new Date(value).getTime();
  return Number.isFinite(parsed) ? parsed : Date.now();
}

/* ===================== CSV 解析 ===================== */
function decodeCSVBuffer(buf){
  const encodings = ["utf-8", "gbk", "gb18030"];
  for(const enc of encodings){
    try {
      const dec = new TextDecoder(enc, { fatal: true });
      const text = dec.decode(buf);
      if(text && !text.includes("�")) return { text, encoding: enc };
    } catch(e){}
  }
  // fallback to gbk without fatal
  try { return { text: new TextDecoder("gbk").decode(buf), encoding: "gbk" }; } catch(e){}
  return { text: new TextDecoder("utf-8").decode(buf), encoding: "utf-8" };
}

function parseCSV(text){
  const rows = [];
  let i = 0, field = "", row = [], inQuote = false;
  text = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  while(i < text.length){
    const c = text[i];
    if(inQuote){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
        inQuote = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if(c === '"'){ inQuote = true; i++; continue; }
    if(c === ","){ row.push(field); field = ""; i++; continue; }
    if(c === "\n"){ row.push(field); field = ""; rows.push(row); row = []; i++; continue; }
    field += c; i++;
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  // 删除尾部空行
  while(rows.length && rows[rows.length-1].every(c => !c.trim())) rows.pop();
  return rows;
}

const FIELD_ALIASES = {
  material_code: ["物料编码","物料代码","物料号","零件号","备件编码","编码","material_code","material code","item_code","item code","part_number","part number","sku","code"],
  system_source: ["系统来源","来源系统","数据来源","数据源","源系统","来源","system_source","source_system","source system","system name","system"],
  material_name: ["物料名称","物料名","备件名称","零件名称","品名","名称","material_name","material name","item_name","item name","part_name","part name","title","name"],
  description:   ["物料描述","物料说明","规格描述","规格参数","技术描述","描述","说明","material_description","material description","item_desc","item description","specification","description","desc","spec"],
  category:      ["物料分类","物料类别","物资分类","物资类别","备件分类","备件类别","大类","分类","类别","品类","material_category","material category","item_category","item category","category","class"],
  unit:          ["计量单位","基本单位","物料单位","单位","unit_of_measure","measure_unit","unit of measure","uom","unit"],
  create_time:   ["创建时间","创建日期","录入时间","导入时间","时间","日期","created_at","create_time","create time","created","timestamp","date"]
};

const AUTO_FIELD_DEFAULTS = {
  system_source: "CSV导入",
  create_time: "导入时间"
};

function normalizeFieldHeader(value){
  return String(value || "").normalize("NFKC").trim().toLowerCase().replace(/[\s_\-./\\()（）\[\]【】:：]+/g, "");
}

function mapFields(headers){
  const mapping = {};
  const used = new Set();
  for(const [field, aliases] of Object.entries(FIELD_ALIASES)){
    const candidates = [];
    aliases.forEach((alias, aliasIndex) => {
      const normalizedAlias = normalizeFieldHeader(alias);
      headers.forEach((header, headerIndex) => {
        if(used.has(header)) return;
        const normalizedHeader = normalizeFieldHeader(header);
        const minLength = /[\u4e00-\u9fff]/.test(normalizedAlias) ? 2 : 4;
        let score = -1;
        if(normalizedHeader === normalizedAlias) score = 1000 + normalizedAlias.length;
        else if(normalizedAlias.length >= minLength && (normalizedHeader.startsWith(normalizedAlias) || normalizedHeader.endsWith(normalizedAlias))) score = 500 + normalizedAlias.length;
        if(score >= 0) candidates.push({ header, score, aliasIndex, headerIndex });
      });
    });
    candidates.sort((a,b) => b.score-a.score || a.aliasIndex-b.aliasIndex || a.headerIndex-b.headerIndex);
    const matched = candidates[0]?.header || null;
    if(matched){ mapping[field] = matched; used.add(matched); }
  }
  // 未映射字段原样保留
  mapping._unmapped = headers.filter(h => !used.has(h));
  return mapping;
}

function buildRow(rawRow, headers, mapping){
  const out = {};
  const used = new Set();
  for(const [field, header] of Object.entries(mapping)){
    if(field.startsWith("_")) continue;
    const idx = headers.indexOf(header);
    out[field] = idx >= 0 ? String(rawRow[idx] || "").trim() : "";
    if(idx >= 0) used.add(header);
  }
  out._extra = Object.fromEntries(headers.map((header, index) => [header, String(rawRow[index] || "").trim()]).filter(([header, value]) => !used.has(header) && value));
  return out;
}

function detectCategory(rawName, rawCategory){
  const txt = `${rawName || ""} ${rawCategory || ""}`.trim();
  if(!txt) return "其他";
  // 先匹配 rawCategory
  if(rawCategory && CANONICAL_CATEGORY[rawCategory.trim()]) return CANONICAL_CATEGORY[rawCategory.trim()];
  // 关键词
  for(const [cat, re] of CATEGORY_FROM_KEYWORDS){
    if(re.test(txt)) return cat;
  }
  return rawCategory || "其他";
}

function standardizeText(text){
  if(!text) return "";
  let t = String(text).toLowerCase();
  for(const [std, syns] of Object.entries(SYNONYMS)){
    for(const s of syns){
      const re = new RegExp(s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
      t = t.replace(re, std);
    }
  }
  return t;
}

function extractBrand(text){
  if(!text) return "";
  const lower = String(text).toLowerCase();
  for(const b of BRANDS){ if(lower.includes(b.toLowerCase())) return b; }
  return "";
}

function extractModel(text){
  if(!text) return "";
  const patterns = [
    /\bcm0?4b[-–—]?0?\d{2,3}\b/i, /\b6[23]\d{2}[-]?\d?[a-z0-9]*\b/i,
    /\bz9?4\d[hwp][-]?\d{1,3}[cp]?/i, /\byb3[-–—]?\d{3}[mls][-]?\d/i,
    /\beja\d{3}[ae]?/i, /\b3051[a-z0-9]*\b/i, /\bpmp\d{2}\b/i,
    /\bhp\d{4}[a-z]*\d*\b/i, /\bpaf[-–—]?\d[-–—]?0\.\d{2}\b/i,
    /\bac[-–—]?\d{3}\b/i, /\bjcg[-–—]?\d{3}\b/i, /\blx[-–—]?\d{3}\b/i,
    /\bsx[-–—]?\d{3}\b/i, /\bcng[-–—]?\d{2}\b/i,
    /\bm1[6-9]|m[2-3][0-9]?\b/i,
    /\bp320\b/i, /\bl-hm46\b/i
  ];
  for(const p of patterns){ const m = String(text).match(p); if(m) return m[0].toUpperCase().replace(/[-—–]/g,"-"); }
  return "";
}

function extractDN(text){
  if(!text) return "";
  const t = String(text);
  let m = t.match(/DN\s*(\d+)/i); if(m) return m[1];
  m = t.match(/(\d+)\s*mm/i); if(m) return m[1];
  m = t.match(/(\d+)\s*寸/); if(m){ const map = {"3":"80","4":"100","6":"150","8":"200","10":"250","12":"300"}; return map[m[1]] || m[1]; }
  return "";
}

function extractPressure(text){

function buildSemanticText(rec){
  const text = `${rec.material_name || ""} ${rec.description || ""}`;
  const std = standardizeText(text);
  const tokens = [];
  const model = rec._ext?.model || extractModel(text);
  const brand = rec._ext?.brand || extractBrand(text);
  const dn = rec._ext?.dn || extractDN(text);
  const pressure = rec._ext?.pressure || extractPressure(text);
  const material = rec._ext?.material || extractMaterial(text);
  if(model) tokens.push(model, model, model);
  if(brand) tokens.push(brand, brand);
  if(dn) tokens.push("DN" + dn, "DN" + dn);
  if(pressure) tokens.push(pressure, pressure);
  if(material) tokens.push(material, material);
  // 中文片段
  const cn = (std.match(/[\u4e00-\u9fa5]{2,5}/g) || []);
  tokens.push(...cn.slice(0, 6));
  // 字符 n-gram (2-3)
  const clean = std.replace(/[^\u4e00-\u9fa5a-z0-9]/g, "").slice(0, 400);
  for(let n = 2; n <= 3; n++){
    for(let i = 0; i <= clean.length - n; i++) tokens.push(clean.substring(i, i+n));
  }
  return tokens;
}

function tfidfVector(tokens){
  const tf = new Map();
  for(const t of tokens) tf.set(t, (tf.get(t) || 0) + 1);
  const total = tokens.length || 1;
  return new Map(Array.from(tf, ([k, v]) => [k, v / total]));
}

function cosine(v1, v2){
  let dot = 0, n1 = 0, n2 = 0;
  for(const [k, v] of v1){ n1 += v*v; if(v2.has(k)) dot += v * v2.get(k); }
  for(const [, v] of v2) n2 += v*v;
  if(n1 === 0 || n2 === 0) return 0;
  return dot / Math.sqrt(n1 * n2);
}

/* ===================== 治理引擎 ===================== */
function clusterRecords(records){
  const vectors = records.map(r => tfidfVector(buildSemanticText(r)));
  const n = records.length;
  const parent = Array.from({length: n}, (_, i) => i);
  const find = x => parent[x] === x ? x : (parent[x] = find(parent[x]));
  const union = (a, b) => { const ra = find(a), rb = find(b); if(ra !== rb) parent[ra] = rb; };
  for(let i = 0; i < n; i++){
    for(let j = i + 1; j < n; j++){
      const sim = cosine(vectors[i], vectors[j]);
      const r1 = records[i]._ext, r2 = records[j]._ext;
      // 关键属性必须一致：型号相同、压力相同、DN 相同；材质可宽容
      if(r1.model && r2.model && r1.model !== r2.model) continue;
      if(r1.pressure && r2.pressure && r1.pressure !== r2.pressure) continue;
      if(r1.dn && r2.dn && r1.dn !== r2.dn) continue;
      // 综合相似度阈值
      let bonus = 0;
      if(r1.brand && r2.brand && r1.brand === r2.brand) bonus += 0.15;
      if(r1.material && r2.material && r1.material === r2.material) bonus += 0.1;
      const finalSim = Math.min(1, sim + bonus);
      if(finalSim >= 0.55) union(i, j);
    }
  }
  const groups = new Map();
  for(let i = 0; i < n; i++){
    const r = find(i);
    if(!groups.has(r)) groups.set(r, []);
    groups.get(r).push(i);
  }
  return Array.from(groups.values());
}

function detectConflicts(records){
  // 组内属性冲突：型号/DN/压力/材质 不同则触发
  const sets = { model: new Set(), dn: new Set(), pressure: new Set(), material: new Set(), brand: new Set() };
  for(const r of records){
    for(const k of Object.keys(sets)) if(r._ext[k]) sets[k].add(r._ext[k]);
  }
  const conflicts = [];
  if(sets.model.size > 1) conflicts.push({field:"型号", values: [...sets.model]});
  if(sets.dn.size > 1) conflicts.push({field:"口径", values: [...sets.dn]});
  if(sets.pressure.size > 1) conflicts.push({field:"压力", values: [...sets.pressure]});
  if(sets.material.size > 1) conflicts.push({field:"材质", values: [...sets.material]});
  return conflicts;
}

  // 品牌（润滑油/润滑脂类品牌放前面）
  if(ext.brand) {
    if(["润滑油", "润滑脂", "液压油", "齿轮油"].includes(category)) {
      parts.unshift(ext.brand);  // 润滑油类品牌在前
    } else if(["壳牌", "美孚", "长城", "昆仑", "Shell", "Mobil", "Kunlun", "Great Wall"].includes(ext.brand)) {
      parts.unshift(ext.brand);  // 知名品牌放前面
    }
  }

  // 型号
  if(ext.model && hasModelCategory) parts.push(ext.model);

  // 品类（如果不是品牌前置的情况）
  if(parts.length === 0 || !["润滑油", "润滑脂", "液压油", "齿轮油"].includes(category)) {
    parts.push(category);
  } else if (!parts.includes(category)) {
    parts.push(category);
  }

  // 规格属性
  const specs = [];
  if(ext.dn && hasDNCategory) specs.push("DN" + ext.dn);
  if(ext.pressure && hasPressureCategory) specs.push(ext.pressure);
  if(ext.material && hasMaterialCategory) specs.push(ext.material);
  if(specs.length) parts.push(specs.join(" "));

  return parts.join(" ");
}

function runGovernance(batch){
  const records = batch.records.map(r => {
    const text = `${r.material_name || ""} ${r.description || ""}`;
    r._ext = {
      model: extractModel(text),
      brand: extractBrand(text),
      dn: extractDN(text),
      pressure: extractPressure(text),
      material: extractMaterial(text)
    };
    r._category = detectCategory(r.material_name, r.category);
    return r;
  });
  const groups = clusterRecords(records);
  const masters = [];
  const reviews = [];
  // 预加载已批准主数据目录（跨批次）
  const approvedCatalog = STATE.canonicalMasters || [];
  let mdmCounters = STATE.mdmCounters || {};
  // 同步计数器：找出每个前缀已用的最大序号
  for(const m of approvedCatalog){
    const prefix = (m.mdm_code || "").split("-").slice(0,2).join("-");
    if(!prefix) continue;
    const num = parseInt(((m.mdm_code||"").split("-")[2])||"0", 10);
    if(num > (mdmCounters[prefix] || 0)) mdmCounters[prefix] = num;
  }

  const nextCode = (prefix) => {
    mdmCounters[prefix] = (mdmCounters[prefix] || 0) + 1;
    return `${prefix}-${String(mdmCounters[prefix]).padStart(4,"0")}`;
  };

  for(const groupIdx of groups){
    const idxs = groupIdx;
    const items = idxs.map(i => records[i]);
    const conflicts = detectConflicts(items);
    const category = items[0]._category || "其他";
    const standardName = generateStandardName(items, category);
    const prefix = CATEGORY_PREFIX[category] || "MDM-X";
    const ext0 = items[0]._ext;
    const hasMultipleSystems = new Set(items.map(r => r.system_source)).size >= 2;
    const hasMultiple = items.length >= 2;

    // 决策：
    // - 1条记录：建议新建
    // - 多条无冲突：自动合并
    // - 多条但有冲突：进入审核
    // - 已批准主数据目录中存在近似匹配 → 复用其编码
    let decision = "NEW", confidence = 0.6, mdmCode, usedCatalog = null;
    if(hasMultiple && conflicts.length === 0){
      decision = "AUTO_MERGE"; confidence = 0.92;
    } else if(hasMultiple && conflicts.length > 0){
      decision = "REVIEW"; confidence = 0.72;
    }

    // 查目录
    if(approvedCatalog.length){
      const candidates = approvedCatalog.map(cm => {
        const cExt = cm._ext || {};
        let score = 0;
        if(cm.category === category) score += 0.3;
        if(cExt.model && ext0.model && cExt.model === ext0.model) score += 0.3;
        if(cExt.brand && ext0.brand && cExt.brand === ext0.brand) score += 0.15;
        if(cExt.dn && ext0.dn && cExt.dn === ext0.dn) score += 0.1;
        if(cExt.pressure && ext0.pressure && cExt.pressure === ext0.pressure) score += 0.1;
        if(cExt.material && ext0.material && cExt.material === ext0.material) score += 0.1;
        return { cm, score };
      }).filter(x => x.score >= 0.55).sort((a,b) => b.score - a.score).slice(0, 3);

      if(candidates.length && decision !== "REVIEW"){
        // 高分匹配且无冲突 → 复用
        if(candidates[0].score >= 0.7 && conflicts.length === 0){
          usedCatalog = candidates[0].cm;
          mdmCode = usedCatalog.mdm_code;
          decision = "AUTO_MERGE";
          confidence = candidates[0].score;
        }
      }
      if(candidates.length && decision === "REVIEW"){
        // 在 reason 中提示候选
        const master = {
          mdm_code: mdmCode || nextCode(prefix),
          standard_name: usedCatalog ? usedCatalog.standard_name : standardName,
          category, _ext: ext0,
          model: ext0.model || "", brand: ext0.brand || "", dn: ext0.dn || "",
          pressure: ext0.pressure || "", material: ext0.material || "",
          source_count: items.length,
          source_systems: [...new Set(items.map(r => r.system_source))].join(","),
          confidence, decision,
          code_prefix: mdmCode ? mdmCode.split("-").slice(0,2).join("-") : prefix,
          source_records: items.map(r => r.material_code || "").join(";"),
          _records: items
        };
        masters.push(master);
        const reason = `组内${conflicts.map(c=>`${c.field}冲突(${c.values.join(" vs ")})`).join("；")}；候选已批准主数据：${candidates.slice(0,3).map(c=>`${c.cm.mdm_code}(${(c.score*100).toFixed(0)}%)`).join("、")}`;
        reviews.push({
          id: uid(),
          mdm_code: master.mdm_code,
          standard_name: master.standard_name,
          confidence, reason,
          source_records: master.source_records,
          source_systems: master.source_systems,
          applied_rules: conflicts.length ? "R008-型号冲突拦截" : "R006-中置信度审核",
          category, _ext: ext0, _records: items,
          status: "REVIEW",
          candidates: candidates.map(c => ({mdm_code: c.cm.mdm_code, score: c.score, name: c.cm.standard_name}))
        });
        continue;
      }
    }

    if(!mdmCode) mdmCode = nextCode(prefix);
    const master = {
      mdm_code: mdmCode,
      standard_name: usedCatalog ? usedCatalog.standard_name : standardName,
      category, _ext: ext0,
      model: ext0.model || "", brand: ext0.brand || "", dn: ext0.dn || "",
      pressure: ext0.pressure || "", material: ext0.material || "",
      source_count: items.length,
      source_systems: [...new Set(items.map(r => r.system_source))].join(","),
      confidence, decision,
      code_prefix: mdmCode.split("-").slice(0,2).join("-"),
      source_records: items.map(r => r.material_code || "").join(";"),
      _records: items
    };
    masters.push(master);
    if(decision === "REVIEW"){
      const reason = conflicts.length ? `组内属性冲突：${conflicts.map(c=>`${c.field}(${c.values.join(" vs ")})`).join("；")}` : `平均相似度${(confidence*100).toFixed(1)}%`;
      reviews.push({
        id: uid(),
        mdm_code: mdmCode, standard_name: master.standard_name,
        confidence, reason, source_records: master.source_records,
        source_systems: master.source_systems,
        applied_rules: conflicts.length ? "R008-型号冲突拦截" : "R006-中置信度审核",
        category, _ext: ext0, _records: items, status: "REVIEW",
        candidates: []
      });
    }
  }
  // 标记一次性使用 _records 不入存储
  return { masters, reviews, mdmCounters };
}

/* ===================== 质量分析（修复版：基于真实脏数据计算） ===================== */
function analyzeQuality(batch){
  const records = batch.records || [];
  const systems = {};
  for(const r of records){
    const sys = r.system_source || "未分类";
    if(!systems[sys]) systems[sys] = [];
    systems[sys].push(r);
  }

  const result = { overall: { completeness:0, accuracy:0, consistency:0, uniqueness:0, standardization:0, score:0, recordCount: records.length }, systems: {}, issues: [], suggestions: [] };
  const perSystemScores = [];

  // 全局统计：跨系统重复编码
  const codeSystemMap = new Map();
  for(const r of records){
    const code = r.material_code || "";
    if(code){
      if(!codeSystemMap.has(code)) codeSystemMap.set(code, new Set());
      codeSystemMap.get(code).add(r.system_source);
    }
  }
  const duplicateCodes = Array.from(codeSystemMap.entries()).filter(([code, systems]) => systems.size > 1);

  // 全局统计：同物异名（通过标准化名称检测）
  const nameGroups = new Map();
  for(const r of records){
    const stdName = standardizeText(`${r.material_name || ""} ${r.description || ""}`);
    // 提取核心关键词作为分组键
    let key = r.material_name || "";
    // 标准化同义词
    for(const [std, syns] of Object.entries(SYNONYMS)){
      for(const s of syns){
        if(key.toLowerCase().includes(s.toLowerCase())){ key = std; break; }
      }
      if(key === std) break;
    }
    if(!key) key = "其他";
    if(!nameGroups.has(key)) nameGroups.set(key, []);
    nameGroups.get(key).push(r);
  }
  // 统计有多少组存在跨系统同物异名
  let synonymGroups = 0;
  for(const [key, items] of nameGroups){
    if(items.length >= 2 && new Set(items.map(i => i.system_source)).size > 1){
      const names = [...new Set(items.map(i => i.material_name))];
      if(names.length > 1) synonymGroups++;
    }
  }

  for(const [sysName, sysRecords] of Object.entries(systems)){
    const total = sysRecords.length;
    if(!total){ result.systems[sysName] = { completeness:0, accuracy:0, consistency:0, uniqueness:0, standardization:0, score:0, count:0, issues:[], suggestions:[] }; continue; }

    // 1. 完整性：检查关键属性是否存在（描述中是否包含型号、材质、压力等）
    let hasModel = 0, hasMaterial = 0, hasPressure = 0, hasDN = 0, hasBrand = 0, hasDesc = 0, hasCategory = 0;
    for(const r of sysRecords){
      const text = `${r.material_name || ""} ${r.description || ""}`;
      if(extractModel(text)) hasModel++;
      if(extractMaterial(text)) hasMaterial++;
      if(extractPressure(text)) hasPressure++;
      if(extractDN(text)) hasDN++;
      if(extractBrand(text)) hasBrand++;
      if(r.description && r.description.length > 5) hasDesc++;
      if(r.category && r.category.trim()) hasCategory++;
    }
    // 完整性 = 有描述 + 有分类 + 至少3个关键属性（型号/材质/压力/DN/品牌）
    const attrCounts = sysRecords.map(r => {
      const text = `${r.material_name || ""} ${r.description || ""}`;
      let cnt = 0;
      if(extractModel(text)) cnt++;
      if(extractMaterial(text)) cnt++;
      if(extractPressure(text)) cnt++;
      if(extractDN(text)) cnt++;
      if(extractBrand(text)) cnt++;
      return cnt;
    });
    const avgAttrs = attrCounts.reduce((a,b) => a+b, 0) / total;
    const completeness = Math.round(
      (hasDesc / total * 30) +          // 描述完整性 30%
      (hasCategory / total * 20) +        // 分类完整性 20%
      (Math.min(avgAttrs / 3, 1) * 50)   // 关键属性平均数（期望3个）50%
    );

    // 2. 准确性：编码格式 + 同系统内编码唯一性 + 时间格式
    let validCode = 0, uniqueCode = 0, validDate = 0;
    const sysCodes = new Set();
    const duplicateInSystem = [];
    for(const r of sysRecords){
      const code = r.material_code || "";
      // 编码格式检查
      if(/^[A-Za-z0-9\-_.]{6,}$/.test(code)) validCode++;
      // 同系统内编码重复检查
      if(code){
        if(sysCodes.has(code)) duplicateInSystem.push(code);
        else sysCodes.add(code);
      }
      // 时间格式检查
      if(/^\d{4}[-\/]\d{2}[-\/]\d{2}/.test(r.create_time || "")) validDate++;
    }
    uniqueCode = sysCodes.size;
    const accuracy = Math.round(
      (validCode / total * 40) +         // 编码格式合规 40%
      (uniqueCode / total * 40) +        // 编码唯一性 40%
      (validDate / total * 20)           // 时间格式 20%
    );

    // 3. 一致性：同名物料的描述、品类、单位是否一致（跨记录）
    const grouped = new Map();
    for(const r of sysRecords){
      const key = (r.material_name || "").toLowerCase().trim();
      if(!key) continue;
      if(!grouped.has(key)) grouped.set(key, []);
      grouped.get(key).push(r);
    }
    let sameDesc = 0, sameCat = 0, sameUnit = 0, total2 = 0;
    for(const arr of grouped.values()){
      if(arr.length < 2) continue;
      total2++;
      const descs = new Set(arr.map(r => standardizeText(r.description || "")));
      const cats = new Set(arr.map(r => (r.category || "").trim()));
      const units = new Set(arr.map(r => (r.unit || "").trim()));
      if(descs.size <= 1) sameDesc++;
      if(cats.size <= 1) sameCat++;
      if(units.size <= 1) sameUnit++;
    }
    const consistency = total2 ? Math.round((sameDesc + sameCat + sameUnit) / (total2 * 3) * 100) : 100;

    // 4. 唯一性：编码跨系统重复检测
    const sysDupCodes = sysRecords.filter(r => {
      const code = r.material_code || "";
      if(!code) return false;
      const systems = codeSystemMap.get(code);
      return systems && systems.size > 1;
    }).length;
    const uniqueness = Math.round((1 - sysDupCodes / total) * 100);

    // 5. 标准化程度：物料名称是否使用标准命名（中文为主、无中英文混用、无缩写）
    let stdNameCount = 0;
    for(const r of sysRecords){
      const name = r.material_name || "";
      // 标准命名：以中文开头、不含英文缩写（如Bearing）、不含非标准简称
      const hasEnglishOnly = /^[A-Za-z\s]+$/.test(name);  // 纯英文名称（如Bearing）
      const hasAbbreviation = /^(机封|O圈|螺栓)$/.test(name);  // 非标准简称
      const isStandard = !hasEnglishOnly && !hasAbbreviation && name.length >= 3;
      if(isStandard) stdNameCount++;
    }
    const standardization = Math.round(stdNameCount / total * 100);

    // 综合评分（五维平均）
    const score = Math.round((completeness + accuracy + consistency + uniqueness + standardization) / 5);

    // 问题清单
    const sysIssues = [];
    if(completeness < 85) sysIssues.push({level:"high", text:`关键属性缺失率高（完整率${completeness}%）：${total - hasDesc}条缺少有效描述，${total - hasModel}条未识别型号，${total - hasMaterial}条未识别材质`, action:"补全物料描述字段，确保包含型号、材质、压力、DN等关键属性信息。"});
    if(accuracy < 85) sysIssues.push({level:"high", text:`编码规范性不足（准确率${accuracy}%）：${total - validCode}条编码格式不规范，${duplicateInSystem.length}条同系统内编码重复`, action:`统一编码规则为"系统前缀+类别代码+流水号"格式（如MAT-SAP-0001），清理重复编码。`});
    if(consistency < 70) sysIssues.push({level:"mid", text:`同名物料字段一致性低（${consistency}%）：${total2 - sameDesc}组描述不一致，${total2 - sameCat}组分类不一致`, action:`建立标准化物料模板，统一同名物料的描述文本、分类编码和计量单位。`});
    if(uniqueness < 90) sysIssues.push({level:"mid", text:`跨系统编码重复（唯一性${uniqueness}%）：${sysDupCodes}条记录与其他系统编码重复`, action:"建立集团级统一编码体系，消除跨系统一物多码问题。"});
    if(standardization < 80) sysIssues.push({level:"mid", text:`物料名称标准化率低（${standardization}%）：存在英文名称（如Bearing）、非标准简称（如"机封"）`, action:'制定物料命名规范，使用品牌+型号+品类+规格标准格式，替换同义词为非标准简称。'});

    // 整改建议（去重）
    const suggestionSet = new Set();
    if(completeness < 85) suggestionSet.add("1. 补全物料描述：在描述字段中补充型号（如CM04B-060）、材质（如316L）、压力等级（如1.6MPa）、口径（如DN200）等关键属性。");
    if(accuracy < 85) suggestionSet.add("2. 规范编码体系：采用统一编码规则\"来源系统-类别-流水号\"（如MAT-SAP-0001），禁止同一系统内编码重复。");
    if(consistency < 70) suggestionSet.add("3. 统一字段标准：建立物料描述模板，确保同名物料使用相同的分类、单位和描述格式。");
    if(uniqueness < 90) suggestionSet.add("4. 消除重复编码：建立集团级主数据编码映射表，将SAP/EAM/采购平台的重复编码关联到统一MDM编码。");
    if(standardization < 80) suggestionSet.add("5. 标准化名称：建立同义词库（机封→机械密封、Bearing→轴承），统一使用中文学术名称。");
    suggestionSet.add("6. 建立质量监控机制：每月扫描新增数据，自动检测编码重复、属性缺失、名称不规范等问题。");

    result.systems[sysName] = { completeness, accuracy, consistency, uniqueness, standardization, score, count: total, issues: sysIssues, suggestions: [...suggestionSet] };
    perSystemScores.push({ sysName, score, issues: sysIssues });
    // 汇总问题
    for(const i of sysIssues) result.issues.push({ system: sysName, ...i });
    for(const s of suggestionSet) result.suggestions.push(s);
  }

  // 全局问题
  if(duplicateCodes.length > 0){
    result.issues.push({level:"high", text:`全局：发现${duplicateCodes.length}个编码跨系统重复（如${duplicateCodes.slice(0,3).map(([c]) => c).join("、")}...）`, action:"建立编码映射表，将重复编码关联到统一主数据。"});
  }
  if(synonymGroups > 0){
    result.issues.push({level:"mid", text:`全局：发现${synonymGroups}组跨系统同物异名（如"机封"="机械密封"="Mechanical Seal"）`, action:"建立同义词库，自动归一化非标准名称。"});
  }

  if(perSystemScores.length){
    result.overall.completeness = Math.round(perSystemScores.reduce((s,x) => s + (result.systems[x.sysName]?.completeness || 0), 0) / perSystemScores.length);
    result.overall.accuracy = Math.round(perSystemScores.reduce((s,x) => s + (result.systems[x.sysName]?.accuracy || 0), 0) / perSystemScores.length);
    result.overall.consistency = Math.round(perSystemScores.reduce((s,x) => s + (result.systems[x.sysName]?.consistency || 0), 0) / perSystemScores.length);
    result.overall.uniqueness = Math.round(perSystemScores.reduce((s,x) => s + (result.systems[x.sysName]?.uniqueness || 0), 0) / perSystemScores.length);
    result.overall.standardization = Math.round(perSystemScores.reduce((s,x) => s + (result.systems[x.sysName]?.standardization || 0), 0) / perSystemScores.length);
    result.overall.score = Math.round((result.overall.completeness + result.overall.accuracy + result.overall.consistency + result.overall.uniqueness + result.overall.standardization) / 5);
  }
  return result;
}

/* ===================== IndexedDB 存储 ===================== */
const DB_NAME = "mdm_enterprise_demo_v1";
const DB_VERSION = 1;
const STORES = ["batches","records","masters","mappings","reviews","qualityReports","searchHistory","lifecycle","distributionLogs","canonicalMasters","settings"];

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (ev) => {
      const db = ev.target.result;
      for(const s of STORES){
        if(!db.objectStoreNames.contains(s)){
          const store = db.createObjectStore(s, { keyPath: "id", autoIncrement: true });
          if(s === "batches" || s === "canonicalMasters"){ store.createIndex("by_key", "batch_id", { unique: false }); }
          if(s === "settings"){}
        }
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbPut(storeName, value){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readwrite");
    const store = tx.objectStore(storeName);
    const req = store.put(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbGet(storeName, id){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readonly");
    const req = tx.objectStore(storeName).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbAll(storeName){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readonly");
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function dbClear(storeName){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readwrite");
    const req = tx.objectStore(storeName).clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

async function dbDelete(storeName, id){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readwrite");
    const req = tx.objectStore(storeName).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function getActiveBatchId(){

function activateBatch(batchId){

function deactivateBatch(){

function getWorkflowSteps(){

  return source.map((step, index) => ({
    ...step,
    step_code: step.step_code || step.code || "",
    ordinal: Number(step.ordinal || step.step || index + 1),
    name: step.name || step.title || `治理步骤 ${index + 1}`,
    status: step.status || "WAITING",
    progress: Number(step.progress || 0)
  }));
}

function workflowStepClass(status){
  return { COMPLETED:"done", ACTION_REQUIRED:"action", READY:"ready", WAITING:"waiting" }[status] || "waiting";
}

/* ===================== CSV 导出 ===================== */
function csvCell(v){
  if(v == null) return "";
  const s = String(v);
  if(/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function downloadCSV(filename, headers, rows){
  const lines = [headers.map(csvCell).join(",")];
  for(const r of rows) lines.push(r.map(csvCell).join(","));
  const csv = "\ufeff" + lines.join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function loadAll(){
  const activeBatchId = getActiveBatchId();
  if(!activeBatchId){
    resetBatchState();
    updateEngineStatus();
    return;
  }
  try {
    STATE.canonicalMasters = await dbAll("canonicalMasters");
  } catch(e){ console.warn("canonicalMasters load fail", e); STATE.canonicalMasters = []; }
  try {
    const settings = await dbAll("settings");
    const sCounters = settings.find(x => x.key === "mdmCounters");
    if(sCounters) STATE.mdmCounters = sCounters.value || {};
  } catch(e){ console.warn("settings load fail", e); }
  try {
    const batches = await dbAll("batches");
    if(activeBatchId && batches.some(batch => batch.batch_id === activeBatchId)){
      await loadBatch(activeBatchId);
    }
  } catch(e){ console.warn("batches load fail", e); }
  try { STATE.searchHistory = await dbAll("searchHistory"); } catch(e){ STATE.searchHistory = []; }
  try { STATE.lifecycle = await dbAll("lifecycle"); } catch(e){ STATE.lifecycle = []; }
  try { STATE.distributionLogs = await dbAll("distributionLogs"); } catch(e){ STATE.distributionLogs = []; }
  try { updateEngineStatus(); } catch(e){ console.warn("updateEngineStatus fail", e); }
}

async function loadBatch(batchId){
  const batches = await dbAll("batches");
  const cur = batches.find(b => b.batch_id === batchId);
  if(!cur) return;
  STATE.currentBatch = cur;
  const allRecords = await dbAll("records");
  STATE.records = allRecords.filter(r => r.batch_id === batchId);
  const allMasters = await dbAll("masters");
  STATE.masters = allMasters.filter(m => m.batch_id === batchId);
  const allMappings = await dbAll("mappings");
  STATE.mappings = allMappings.filter(m => m.batch_id === batchId);
  const allReviews = await dbAll("reviews");
  STATE.reviews = allReviews.filter(r => r.batch_id === batchId && r.status === "REVIEW");
  const qrs = await dbAll("qualityReports");
  STATE.qualityReport = qrs.find(q => q.batch_id === batchId) || null;
}

async function saveBatch(batchInfo, records, masters, mappings, reviews){
  // 写入批次
  await dbPut("batches", batchInfo);
  // 清空该批次旧数据
  for(const store of ["records","masters","mappings","reviews"]){
    const all = await dbAll(store);
    for(const x of all) if(x.batch_id === batchInfo.batch_id) await dbDelete(store, x.id);
  }
  // 写新数据
  for(const r of records){ await dbPut("records", { batch_id: batchInfo.batch_id, ...r }); }
  for(const m of masters){ await dbPut("masters", { batch_id: batchInfo.batch_id, ...m }); }
  for(const m of mappings){ await dbPut("mappings", { batch_id: batchInfo.batch_id, ...m }); }
  for(const r of reviews){ await dbPut("reviews", { batch_id: batchInfo.batch_id, ...r }); }
}

async function cacheServerState(payload){
  for(const store of ["batches","records","masters","mappings","reviews","qualityReports","searchHistory","lifecycle","distributionLogs","canonicalMasters"]){
    await dbClear(store);
  }
  if(!payload.batch) return;
  await saveBatch(payload.batch, payload.records, payload.masters, payload.mappings, payload.reviews);
  if(payload.quality_report){
    await dbPut("qualityReports", { batch_id:payload.batch.batch_id, ...payload.quality_report, generated_at:Date.now() });
  }
  for(const row of payload.search_history || []) await dbPut("searchHistory", row);
  for(const row of payload.lifecycle || []) await dbPut("lifecycle", row);
  for(const row of payload.distribution_logs || []) await dbPut("distributionLogs", row);
  for(const row of payload.masters || []){
    if(row.decision !== "REVIEW") await dbPut("canonicalMasters", { ...row, approved_at:Date.now() });
  }
}

async function syncServerState(payload, cache=true){
  const withTime = (row) => ({ ...row, created_at:serverTime(row.created_at) });
  STATE.currentBatch = payload.batch ? withTime(payload.batch) : null;
  if(STATE.currentBatch) activateBatch(STATE.currentBatch.batch_id);
  else deactivateBatch();
  STATE.records = (payload.records || []).map(withTime);
  STATE.masters = (payload.masters || []).map(row => ({ ...row, _ext:row._ext || {
    model:row.model || "", brand:row.brand || "", dn:row.dn || "", pressure:row.pressure || "", material:row.material || ""
  }}));
  STATE.mappings = payload.mappings || [];
  STATE.reviews = payload.reviews || [];
  STATE.qualityReport = payload.quality_report || null;
  STATE.searchHistory = (payload.search_history || []).map(withTime);
  STATE.lifecycle = (payload.lifecycle || []).map(withTime);
  STATE.distributionLogs = (payload.distribution_logs || []).map(row => ({
    ...withTime(row), error_msg:row.status === "FAILED" ? (row.message || "") : ""
  }));
  STATE.feedback = payload.feedback || [];
  STATE.workflow = payload.workflow || { steps:[], progress:0, closed_loop:false };
  STATE.vectorIndex = payload.vector_index || { count:0, indexes:[] };
  STATE.canonicalMasters = STATE.masters.filter(row => row.decision !== "REVIEW");
  STATE.backendOnline = true;
  if(cache) await cacheServerState({
    ...payload,
    batch:STATE.currentBatch,
    records:STATE.records,
    masters:STATE.masters,
    reviews:STATE.reviews,
    search_history:STATE.searchHistory,
    lifecycle:STATE.lifecycle,
    distribution_logs:STATE.distributionLogs
  });
  updateEngineStatus();
}

async function loadServerState(){
  if(!STATE.workflowDefinition.length){
    try {
      const capabilities = await apiRequest("/agent/capabilities");
      STATE.workflowDefinition = Array.isArray(capabilities.workflow) ? capabilities.workflow : [];
    } catch(error){
      console.warn("workflow definition unavailable", error);
    }
  }
  if(!STATE.standardStats){
    try {
      STATE.standardStats = await apiRequest("/standards/stats");
    } catch(error){
      console.warn("standard knowledge stats unavailable", error);
    }
  }
  try {
    STATE.ocrInstall = await apiRequest("/ocr/install");
  } catch(error){
    console.warn("OCR installer status unavailable", error);
  }
  const activeBatchId = STATE.currentBatch?.batch_id || getActiveBatchId();
  if(!activeBatchId){
    await apiRequest("/health");
    resetBatchState();
    STATE.backendOnline = true;
    updateEngineStatus();
    return { batch:null, records:[], masters:[], mappings:[], reviews:[], workflow:{ steps:[], progress:0, closed_loop:false } };
  }
  let payload;
  try {
    payload = await apiRequest(`/batches/${encodeURIComponent(activeBatchId)}?plant_code=${encodeURIComponent(STATE.viewPlant || "GROUP")}`);
  } catch(error){
    if(String(error.message || "").includes("batch not found")){
      deactivateBatch();
      resetBatchState();
      STATE.backendOnline = true;
      updateEngineStatus();
      return { batch:null, records:[], masters:[], mappings:[], reviews:[], workflow:{ steps:[], progress:0, closed_loop:false } };
    }
    throw error;
  }
  await syncServerState(payload, true);
  if(STATE.currentBatch){
    try {
      STATE.plantCollaboration = await apiRequest(`/plants?batch_id=${encodeURIComponent(STATE.currentBatch.batch_id)}`);
    } catch(error){
      STATE.plantCollaboration = null;
      console.warn("plant collaboration unavailable", error);
    }
    const batchId = encodeURIComponent(STATE.currentBatch.batch_id);
    const [graphResult, chainResult] = await Promise.allSettled([
      apiRequest(`/graph?batch_id=${batchId}&raw_limit=50`),
      apiRequest(`/blockchain/blocks?batch_id=${batchId}`)
    ]);
    STATE.graphData = graphResult.status === "fulfilled" ? graphResult.value : { nodes:[], edges:[], stats:{} };
    STATE.auditChain = chainResult.status === "fulfilled" ? chainResult.value : { blocks:[], verification:{ valid:false, block_count:0 } };
  } else {
    STATE.plantCollaboration = null;
    STATE.graphData = { nodes:[], edges:[], stats:{} };
    STATE.auditChain = { blocks:[], verification:{ valid:true, block_count:0 } };
  }
  return payload;
}

function decisionTag(d){
  if(d === "AUTO_MERGE") return `<span class="tag tag-merge">自动合并</span>`;
  if(d === "REVIEW") return `<span class="tag tag-warn">待审核</span>`;
  if(d === "CONFIRMED_NEW") return `<span class="tag tag-new">已确认新建</span>`;
  return `<span class="tag tag-new">建议新建</span>`;
}

function countByKey(arr, key){
  const m = new Map();
  for(const x of (arr || [])){
    const k = x[key] || "(空)";
    m.set(k, (m.get(k) || 0) + 1);
  }
  return Array.from(m, ([name, value]) => ({ name, value })).sort((a,b) => b.value - a.value).slice(0, 12);
}

function renderGovernanceGraph(graphData){
  const nodes = graphData?.nodes || [], edges = graphData?.edges || [];
  if(!nodes.length) return emptyState("◌","暂无治理图谱","上传并治理数据后自动生成血缘关系");
  const width = 720, height = 340, pad = 22;
  const positions = new Map(nodes.map(node => [node.id, {
    x:pad + ((Number(node.x) + 1) / 2) * (width - pad * 2),
    y:pad + ((Number(node.y) + 1) / 2) * (height - pad * 2)
  }]));
  const colors = { MASTER:"#3b82f6", RAW:"#64748b", CATEGORY:"#8b5cf6", SYSTEM:"#06b6d4", PLANT:"#10b981" };
  const lines = edges.map(edge => {
    const a = positions.get(edge.source), b = positions.get(edge.target);
    return a && b ? `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--bd2)" stroke-width="1" opacity=".7"><title>${esc(edge.relation || "关系")}</title></line>` : "";
  }).join("");
  const labelNodes = [...nodes].sort((a,b) => Number(b.centrality || 0) - Number(a.centrality || 0)).slice(0, 14);
  const labelIds = new Set(labelNodes.map(node => node.id));
  const circles = nodes.map(node => {
    const point = positions.get(node.id), radius = node.node_type === "MASTER" ? 5.5 : (node.node_type === "RAW" ? 3 : 4.5);
    const label = String(node.label || node.entity_id || node.id);
    return `<g data-node="${encodeURIComponent(node.id)}" style="cursor:pointer"><circle cx="${point.x}" cy="${point.y}" r="${radius}" fill="${colors[node.node_type] || '#94a3b8'}" stroke="var(--bg2)" stroke-width="1.5"><title>${esc(node.node_type)} · ${esc(label)} · 点击查看关系</title></circle>${labelIds.has(node.id) ? `<text x="${point.x + 7}" y="${point.y - 6}" fill="var(--t2)" font-size="9" pointer-events="none">${esc(label.slice(0,12))}</text>` : ""}</g>`;
  }).join("");
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="主数据治理知识图谱">${lines}${circles}</svg>`;
}

let ocrInstallPollTimer = null;

async function submitPendingOCR(pending){
  if(!pending?.file) return;
  STATE.ocrProcessing = true;
  if(STATE.currentPage === "ingest") render();
  const form = new FormData();
  form.append("image", pending.file);
  form.append("hint_text", pending.hint || "");
  form.append("plant_code", pending.plant || "GROUP");
  try {
    STATE.ocrResult = await apiRequest("/ocr", { method:"POST", body:form });
    STATE.ocrInstall = STATE.ocrResult.install_status || STATE.ocrInstall;
    STATE.pendingOCR = null;
    toast(STATE.ocrResult.real_ocr ? `真实 OCR 完成：${STATE.ocrResult.provider}` : "真实 OCR 不可用，已明确降级解析", STATE.ocrResult.real_ocr ? "success" : "warn", 4500);
  } catch(error){
    toast("图片识别失败：" + error.message, "error", 5000);
  } finally {
    STATE.ocrProcessing = false;
    if(STATE.currentPage === "ingest") render();
  }
}

async function pollOCRInstallation(){
  if(ocrInstallPollTimer) clearTimeout(ocrInstallPollTimer);
  try {
    STATE.ocrInstall = await apiRequest("/ocr/install");
    if(STATE.currentPage === "ingest") render();
    if(STATE.ocrInstall.installing){
      ocrInstallPollTimer = setTimeout(pollOCRInstallation, 1500);
      return;
    }
    if(STATE.ocrInstall.runtime_ready){
      toast("PaddleOCR 安装完成，正在继续识别图片", "success", 4000);
      const pending = STATE.pendingOCR;
      if(pending) await submitPendingOCR(pending);
      return;
    }
    if(STATE.ocrInstall.state === "failed"){
      toast("本地 OCR 安装失败，已继续使用云端或规则降级", "warn", 5000);
      const pending = STATE.pendingOCR;
      if(pending) await submitPendingOCR(pending);
    }
  } catch(error){
    toast("OCR 安装状态检查失败：" + error.message, "error", 5000);
  }
}

window.startOCRInstallation = async function(){
  try {
    STATE.ocrInstall = await apiRequest("/ocr/install", { method:"POST" });
    toast("已开始下载本地 OCR 运行环境", "info", 4000);

/* CSV 上传流程 */
let pendingCSV = null; // {text, encoding, headers, rows, filename}

async function handleCSVFile(file){
  if(!file) return;
  const buf = new Uint8Array(await file.arrayBuffer());
  const { text, encoding } = decodeCSVBuffer(buf);
  const rows = parseCSV(text);
  if(!rows.length){
    toast("未识别到有效记录，请检查表头", "error");
    return;
  }
  const headers = rows[0].map(h => String(h || "").trim());
  pendingCSV = { text, encoding, headers, rows: rows.slice(1), filename: file.name };
  showFieldMapping();
  toast(`已解析文件（${encoding.toUpperCase()}，共 ${rows.length-1} 行）`, "success");
}

function showFieldMapping(recalculate = true){
  const mapping = recalculate ? mapFields(pendingCSV.headers) : pendingCSV._mapping;
  pendingCSV._mapping = mapping;
  const section = $("#mappingSection");
  section.style.display = "block";
  const items = Object.keys(FIELD_ALIASES).map(field => {
    const matched = mapping[field];
    const automatic = !matched && AUTO_FIELD_DEFAULTS[field];
    const resolved = matched || automatic;
    return `
      <div class="field-map-item">
        <div class="raw">CSV 列：${matched ? esc(matched) : automatic ? "系统自动补全" : "(未自动识别)"}</div>
        <div class="mapped ${resolved ? "" : "unmapped"}">${resolved ? "✓" : "✗"} 标准字段：${esc(field)}${automatic ? ` · ${esc(AUTO_FIELD_DEFAULTS[field])}` : ""}</div>
        <select onchange="changeFieldMapping('${esc(field)}', this.value)">
          <option value="">${automatic ? `-- 自动补全：${esc(AUTO_FIELD_DEFAULTS[field])} --` : "-- 选择对应 CSV 列 --"}</option>
          ${pendingCSV.headers.map(h => `<option value="${esc(h)}" ${matched===h?"selected":""}>${esc(h)}</option>`).join("")}
        </select>
      </div>
    `;
  }).join("");
  $("#fieldMapping").innerHTML = items;
  // 显示未映射列
  if(mapping._unmapped.length){
    $("#fieldMapping").insertAdjacentHTML("beforeend", `<div style="grid-column:1/-1;padding:8px 12px;background:rgba(245,158,11,.08);border-radius:8px;font-size:11px;color:var(--w)">⚠ 未映射列：${mapping._unmapped.map(esc).join("、")}（将作为原始数据保留）</div>`);
  }
}

window.changeFieldMapping = function(field, header){
  if(!header){ delete pendingCSV._mapping[field]; }
  else {
    for(const other of Object.keys(FIELD_ALIASES)){
      if(other !== field && pendingCSV._mapping[other] === header) delete pendingCSV._mapping[other];
    }
    pendingCSV._mapping[field] = header;
  }
  const used = new Set(Object.entries(pendingCSV._mapping).filter(([key]) => !key.startsWith("_")).map(([,value]) => value));
  pendingCSV._mapping._unmapped = pendingCSV.headers.filter(headerName => !used.has(headerName));
  showFieldMapping(false);
};

async function applyMappingAndGovern(){
  if(!pendingCSV){ toast("请先上传文件", "warn"); return; }
  const mapping = pendingCSV._mapping || {};
  // 构建记录
  const records = [];
  for(const row of pendingCSV.rows){
    const obj = buildRow(row, pendingCSV.headers, mapping);
    if(!obj.material_code && !obj.material_name && !obj.description) continue;
    records.push(obj);
  }
  if(!records.length){
    toast("映射后无有效记录，请检查文件内容", "error");
    return;
  }
  // 显示进度 + 流水线
  $("#governanceSection").style.display = "block";
  $("#mappingSection").style.display = "none";
  $("#ingestEmpty").style.display = "none";
  showProgress(0, records.length, "准备治理...");
  // 上传阶段按后端提供的流程定义展示进度，最终状态由批次接口确认。
  const workflowSteps = getWorkflowSteps();
  const workflowTitle = workflowSteps.length ? `${workflowSteps.length}步治理闭环` : "治理闭环";
  const stepNames = workflowSteps.map(step => step.name);
  workflowSteps.forEach((_, index) => setStep(index + 1, "waiting", "等待"));
  for(let i = 1; i <= stepNames.length; i++){
    setStep(i, "cur");
    setProgress(i / (stepNames.length + 1), `${stepNames[i-1]}...`);
    await sleep(Math.min(450, 180 + Math.min(records.length, 500) * 2));
    setStep(i, "waiting", "待后端确认");
  }
  setProgress(.9, "Flask 后端正在生成主数据与闭环任务...");
  try {
    const payload = await apiRequest("/batches", {
      method:"POST",
      body:JSON.stringify({
        filename:pendingCSV.filename,
        encoding:pendingCSV.encoding,
        records
      })
    });
    await syncServerState(payload, true);
    (payload.workflow?.steps || []).forEach((step, index) => setStep(index + 1, workflowStepClass(step.status), WORKFLOW_STATUS[step.status] || step.status));
    setProgress(1, `核心治理完成，闭环进度 ${payload.workflow?.progress || 0}%`);
    toast(`核心治理完成：${payload.summary.master_count} 条主数据，${workflowTitle}进度 ${payload.workflow?.progress || 0}%`, "success");
    pendingCSV = null;
    const gs = $("#governanceSection"); if(gs) gs.style.display = "block";
    const ie = $("#ingestEmpty"); if(ie) ie.style.display = "none";
    switchPage("dash");
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch(error){
    console.error("governance API failed", error);
    setProgress(0, "后端治理失败");
    $("#mappingSection").style.display = "block";
    toast("治理失败：" + error.message, "error", 5000);
  }
}

  } else if(type === "mappings"){
    const headers = ["系统来源","原始编码","原始名称","MDM编码","标准名称","决策","相似度","应用规则"];
    const rows = STATE.mappings.map(m => [m.system_source, m.original_code, m.original_name, m.mdm_code, m.standard_name, m.decision, (m.similarity*100).toFixed(2)+"%", m.applied_rules]);
    downloadCSV("02_系统映射表.csv", headers, rows);
  } else if(type === "reviews"){
    const headers = ["MDM编码","标准名称","决策","原因","应用规则","来源记录","置信度"];
    const rows = STATE.reviews.map(r => [r.mdm_code, r.standard_name, r.status, r.reason, r.applied_rules, r.source_records, (r.confidence*100).toFixed(2)+"%"]);
    downloadCSV("03_人工审核清单.csv", headers, rows);
  } else if(type === "filled"){
    const headers = ["原始编码","系统来源","原始名称","原始描述","原始分类","单位","抽取型号","抽取品牌","抽取DN","抽取压力","抽取材质"];
    const rows = STATE.records.map(r => {
      const ext = r._ext || {};
      return [r.material_code, r.system_source, r.material_name, r.description, r.category, r.unit, ext.model||"", ext.brand||"", ext.dn||"", ext.pressure||"", ext.material||""];
    });
    downloadCSV("04_智能填报记录.csv", headers, rows);
  }
};

/* ===================== 自然语言解析（增强版）==================== */
function parseNaturalLanguage(q){
  const text = String(q || "");
  if(!text) return null;
  const conditions = [];
  let remaining = text;

  // 1. 排除条件（"不要..."/"排除..."）
  const excludePatterns = [
    {re: /(?:不要|排除|不含|非)(?:的|是)?[\s]*([^\s,，.。;；]{2,30})/g, type:"exclude", label:"排除"}
  ];
  for(const {re, type, label} of excludePatterns){
    let m;
    while((m = re.exec(text)) !== null){
      conditions.push({type, label, value:m[1].trim(), display:m[1].trim()});
      remaining = remaining.replace(m[0], "");
    }
  }

  // 2. 品牌
  const brandHits = new Set();
  for(const b of BRANDS){
    const re = new RegExp(b.replace(/[+]/g, "\\+"), "i");
    if(re.test(text)){ brandHits.add(b); remaining = remaining.replace(re, ""); }
  }
  brandHits.forEach(b => conditions.push({type:"brand", label:"品牌", value:b, display:b}));

  // 3. 品类
  const catKeywords = Object.keys(CATEGORY_PREFIX).sort((a,b) => b.length - a.length);
  for(const c of catKeywords){
    if(text.includes(c)){ conditions.push({type:"category", label:"品类", value:c, display:c}); remaining = remaining.replace(c, ""); break; }
  }

  // 4. 材质（扩展列表）
  const materialList = ["316L","316","304L","304","2205","C276","铸钢","Q235","35CrMoA","哈氏合金","钛合金","碳化硅","铬钼钢","氟橡胶","丁腈橡胶","硅橡胶","全氟醚","碳钢","不锈钢","合金钢","黄铜","青铜","铝合金","聚四氟乙烯","石墨","橡胶","尼龙"].sort((a,b) => b.length - a.length);
  for(const mat of materialList){
    const materialPattern = new RegExp(mat.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
    if(materialPattern.test(remaining)){ conditions.push({type:"material", label:"材质", value:mat, display:mat}); remaining = remaining.replace(materialPattern, ""); }
  }

  // 5. DN 口径（支持 "DN50-200" 范围）
  const dnRangeMatch = text.match(/[Dd][Nn]\s*(\d+)\s*[~-—-]\s*(\d+)/);
  if(dnRangeMatch){ conditions.push({type:"dn_range", label:"口径范围", value:[dnRangeMatch[1], dnRangeMatch[2]], display:"DN"+dnRangeMatch[1]+"~"+dnRangeMatch[2]}); }
  else {
    const dnMatch = text.match(/[Dd][Nn]\s*(\d+)/);
    if(dnMatch){ conditions.push({type:"dn", label:"口径", value:dnMatch[1], display:"DN"+dnMatch[1]}); }
  }
  // 寸转mm
  const inchMatch = text.match(/(\d+\.?\d*)\s*寸/);
  if(inchMatch){
    const inchMap = {"0.5":"15","1":"25","1.5":"40","2":"50","3":"80","4":"100","6":"150","8":"200","10":"250","12":"300","14":"350","16":"400"};
    const mm = inchMap[inchMatch[1]] || String(Math.round(Number(inchMatch[1])*25.4));
    conditions.push({type:"dn", label:"口径", value:mm, display:"DN"+mm+"("+inchMatch[1]+"寸)"});
  }

  // 6. 压力范围
  const pressRangeMatch = text.match(/(\d+\.?\d*)\s*[~-—-]\s*(\d+\.?\d*)\s*[Mm][Pp][Aa]/);
  if(pressRangeMatch){ conditions.push({type:"pressure_range", label:"压力范围", value:[pressRangeMatch[1]+"MPa", pressRangeMatch[2]+"MPa"], display:pressRangeMatch[1]+"~"+pressRangeMatch[2]+"MPa"}); }
  else {
    const pressureMatch = text.match(/(\d+\.?\d*)\s*[Mm][Pp][Aa]/);
    if(pressureMatch){ conditions.push({type:"pressure", label:"压力", value:pressureMatch[1]+"MPa", display:pressureMatch[1]+"MPa"}); }
  }

  // 7. 型号
  const modelMatch = extractModel(text);
  if(modelMatch){ conditions.push({type:"model", label:"型号", value:modelMatch, display:modelMatch}); }

  // 8. 数量/库存范围
  const qtyRangeMatch = text.match(/(?:库存|数量|大于|超过|至少|最低|>=?|≥)\s*(\d+)/);
  if(qtyRangeMatch){ conditions.push({type:"qty_min", label:"最低库存", value:Number(qtyRangeMatch[1]), display:"≥"+qtyRangeMatch[1]}); }

  // 9. 置信度范围
  const confMatch = text.match(/(?:置信度|可信度|相似度|匹配度).{0,5}(\d{2,3})\s*%?/);
  if(confMatch){ conditions.push({type:"confidence_min", label:"最低置信度", value:Number(confMatch[1])/100, display:confMatch[1]+"%"}); }

  // 10. 多值OR（"A或B" / "A、B、C"）
  const orMatch = text.match(/([^,，.。;；]+?)(?:或|或者)([^,，.。;；]+)/);
  if(orMatch){
    const left = orMatch[1].trim(); const right = orMatch[2].trim();
    if(left.length >= 2 && right.length >= 2){
      conditions.push({type:"or", label:"任一匹配", value:[left, right], display:left+" 或 "+right});
      remaining = remaining.replace(orMatch[0], "");
    }
  }

  // 11. 通用关键词（剩余内容中非停用词）
  const stopWords = ["找","一下","的","要","是","有","没有","和","或","以及","给我","给我找","查","查一下","搜索","检索","帮我","在","中","里","上","下","个","件","种","类","款","台","套","组"];
  const tokens = remaining.split(/[\s,，.。;；]/).filter(t => t.length >= 2 && !stopWords.some(sw => t.includes(sw)));
  if(tokens.length){ conditions.push({type:"keyword", label:"关键词", value:tokens.join(" "), display:tokens.join("、")}); }

  return conditions.length ? conditions : null;
}

/* 根据当前conditions数组渲染条件chips，支持删除 */
function renderConditionChips(conditions, containerId){
  const el = $("#" + containerId);
  if(!el || !conditions || !conditions.length){ el && (el.style.display="none"); return; }
  const typeClass = {brand:"nl-chip-brand", category:"nl-chip-category", dn:"nl-chip-dn", dn_range:"nl-chip-dn", pressure:"nl-chip-pressure", pressure_range:"nl-chip-pressure", material:"nl-chip-material", model:"nl-chip-model", keyword:"nl-chip-keyword", exclude:"nl-chip-exclude", or:"nl-chip-keyword", qty_min:"nl-chip-range", confidence_min:"nl-chip-range"};
  el.innerHTML = `
    <div style="font-size:11px;color:var(--t3);margin-bottom:6px">🤖 已识别 ${conditions.length} 个检索条件（点击 × 可移除）：</div>
    <div class="nl-chips">
      ${conditions.map((c, idx) => `
        <span class="nl-chip ${typeClass[c.type] || 'nl-chip-keyword'}" title="${esc(c.label)}: ${esc(c.display)}">
          ${esc(c.label)}: ${esc(c.display)}
          <span class="remove" onclick="removeSearchCondition(${idx})" title="移除">×</span>
        </span>
      `).join("")}
    </div>
  `;
  el.style.display = "block";
}

/* 移除单个条件后重新搜索 */
window.removeSearchCondition = function(idx){
  const conditions = window._currentSearchConditions;
  if(!conditions || idx < 0 || idx >= conditions.length) return;
  conditions.splice(idx, 1);
  window._currentSearchConditions = conditions;
  renderConditionChips(conditions, "parsedConditions");
  // 重建查询字符串（用剩余条件）
  const q = $("#searchInput").value.trim();
  runSearch(q, conditions.length ? conditions : null);
};

function countHotSearchWords(){
  const m = new Map();
  for(const h of STATE.searchHistory){
    const word = String(h.query || "").trim().toLowerCase();
    if(word) m.set(word, (m.get(word) || 0) + 1);
  }
  return Array.from(m, ([word, count]) => ({ word, count })).sort((a,b) => b.count - a.count).slice(0, 12);
}

window.doSearch = async function(){
  const q = $("#searchInput").value.trim();
  if(!q){ toast("请输入检索词", "warn"); return; }
  if(!STATE.masters.length && !STATE.reviews.length){ $("#searchResult").innerHTML = emptyState("📁","暂无主数据","请先在「批量接入」上传企业 CSV"); return; }
  // 自然语言解析
  const parsed = parseNaturalLanguage(q);
  window._currentSearchConditions = parsed ? [...parsed] : null;
  renderConditionChips(parsed, "parsedConditions");
  const searched = await runSearch(q, parsed);
  if(searched === false) return;
  STATE.searchHistory.unshift({ query:q, created_at:Date.now() });
  await dbClear("searchHistory");
  for(const row of STATE.searchHistory) await dbPut("searchHistory", row);
  $("#hotWordsWrap").innerHTML = countHotSearchWords().map(w => `<span class="hot-word" onclick="quickSearch('${esc(w.word)}')">${esc(w.word)} <span class="cnt">${w.count}</span></span>`).join("");
};
