async function runSearch(q, parsed){
  const query = q.toLowerCase().trim();
  const queryStd = standardizeText(query);

  // 合并高级筛选条件
  let advConditions = [];
  const advCategory = $("#advCategory")?.value;
  const advBrand = $("#advBrand")?.value?.trim();
  const advMaterial = $("#advMaterial")?.value?.trim();
  const advDN = $("#advDN")?.value?.trim();
  const advPressure = $("#advPressure")?.value?.trim();
  const advModel = $("#advModel")?.value?.trim();
  const advExclude = $("#advExclude")?.value?.trim();
  const advConfidence = parseFloat($("#advConfidence")?.value || "0");
  const matchMode = document.querySelector('input[name="matchMode"]:checked')?.value || "and";

  if(advCategory) advConditions.push({type:"category", label:"品类", value:advCategory, display:advCategory});
  if(advBrand) advConditions.push({type:"brand", label:"品牌", value:advBrand, display:advBrand});
  if(advMaterial) advConditions.push({type:"material", label:"材质", value:advMaterial, display:advMaterial});
  if(advDN){
    const dnRange = advDN.match(/(\d+)\s*[~-—-]\s*(\d+)/);
    if(dnRange) advConditions.push({type:"dn_range", label:"口径范围", value:[dnRange[1], dnRange[2]], display:"DN"+dnRange[1]+"~"+dnRange[2]});
    else { const dnSingle = advDN.match(/(\d+)/); if(dnSingle) advConditions.push({type:"dn", label:"口径", value:dnSingle[1], display:"DN"+dnSingle[1]}); }
  }
  if(advPressure){
    const pRange = advPressure.match(/(\d+\.?\d*)\s*[~-—-]\s*(\d+\.?\d*)/);
    if(pRange) advConditions.push({type:"pressure_range", label:"压力范围", value:[pRange[1]+"MPa", pRange[2]+"MPa"], display:pRange[1]+"~"+pRange[2]+"MPa"});
    else { const pSingle = advPressure.match(/(\d+\.?\d*)/); if(pSingle) advConditions.push({type:"pressure", label:"压力", value:pSingle[1]+"MPa", display:pSingle[1]+"MPa"}); }
  }
  if(advModel) advConditions.push({type:"model", label:"型号", value:advModel, display:advModel});
  if(advExclude){
    const excludes = advExclude.split(/[,，]/).map(s => s.trim()).filter(Boolean);
    excludes.forEach(e => advConditions.push({type:"exclude", label:"排除", value:e, display:e}));
  }

  // 合并所有条件
  const allConditions = [...(parsed || []), ...advConditions];

  // 从 parsed 中提取结构化条件
  let brandFilter = null, catFilter = null, dnFilter = null, dnMin = null, dnMax = null, pressFilter = null, pressMin = null, pressMax = null;
  let matFilter = null, modelFilter = null, excludeFilters = [], orFilters = [], qtyMin = null, confMin = null;
  if(allConditions){
    for(const c of allConditions){
      if(c.type === "brand") brandFilter = c.value;
      if(c.type === "category") catFilter = c.value;
      if(c.type === "dn") dnFilter = c.value;
      if(c.type === "dn_range"){ dnMin = Number(c.value[0]); dnMax = Number(c.value[1]); }
      if(c.type === "pressure") pressFilter = c.value;
      if(c.type === "pressure_range"){ pressMin = parseFloat(c.value[0]); pressMax = parseFloat(c.value[1]); }
      if(c.type === "material") matFilter = c.value;
      if(c.type === "model") modelFilter = c.value;
      if(c.type === "exclude") excludeFilters.push(c.value);
      if(c.type === "or") orFilters.push(c.value);
      if(c.type === "qty_min") qtyMin = c.value;
      if(c.type === "confidence_min") confMin = c.value;
    }
  }
  // 额外从查询文本提取
  const qBrand = extractBrand(query); if(!brandFilter && qBrand) brandFilter = qBrand;
  const qDN = extractDN(query); if(!dnFilter && !dnMin && qDN){ dnFilter = qDN; }
  const qPress = extractPressure(query); if(!pressFilter && !pressMin && qPress) pressFilter = qPress;
  const qMaterial = extractMaterial(query); if(!matFilter && qMaterial) matFilter = qMaterial;
  const qModel = extractModel(query); if(!modelFilter && qModel) modelFilter = qModel;

  // 最低置信度
  const minConfidence = Math.max(advConfidence, confMin || 0);

  {
    try {
      const response = await apiRequest("/search", {
        method:"POST",
        body:JSON.stringify({
          query:q,
          batch_id:STATE.currentBatch?.batch_id,
          conditions:allConditions.map(item => ({ type:item.type, value:item.value })),
          match_mode:matchMode,
          min_confidence:minConfidence
        })
      });
      const showingSuggestions = !response.results.length && Array.isArray(response.suggestions) && response.suggestions.length > 0;
      const sourceResults = showingSuggestions ? response.suggestions : response.results;
      const top = sourceResults.map(item => ({ m:item.master, score:item.score, reasons:item.reasons || [] }));
      if(!top.length){
        $("#searchResult").innerHTML = emptyState("🔍","未找到相似物料","可调整关键词或在「生命周期」中创建新物料申请");
        return true;
      }
      const matchModeText = matchMode === "and" ? "全部满足" : matchMode === "or" ? "任一满足" : "模糊匹配";
      const filterSummary = allConditions.length ? `，应用 ${allConditions.length} 个结构化条件` : "";
      $("#searchResult").innerHTML = `
        <div class="search-status">
          <span>${showingSuggestions ? "💡 未找到完全匹配，推荐" : "🔎 共匹配"} <strong style="color:var(--pl)">${showingSuggestions ? response.suggestion_total : response.total}</strong> 条${showingSuggestions ? "相近候选" : "主数据"}，显示 Top ${top.length}</span>
          <span style="color:var(--t3);margin-left:auto">${showingSuggestions ? "候选结果仅满足部分条件，请核对后使用" : `匹配模式: ${matchModeText}${filterSummary}`}</span>
        </div>
        ${top.map(result => `
          <div class="search-hit">
            <div class="search-hit-head">
              <span class="search-hit-code">${esc(result.m.mdm_code)}</span>
              <span class="search-hit-score" style="color:${result.score>=0.8?'var(--s)':result.score>=0.6?'var(--w)':'var(--t3)'}">${(result.score*100).toFixed(0)}%</span>
            </div>
            <div class="search-hit-name">${esc(result.m.standard_name)}</div>
            <div class="search-hit-meta">${esc(result.m.category || "")} · ${esc(result.m.model || "-")} · ${esc(result.m.brand || "-")} · 来源 ${result.m.source_count || 0} 条</div>
            <div class="search-hit-reason">${result.reasons.map(reason => `<span class="tag ${showingSuggestions ? 'tag-warn' : 'tag-ok'}">${esc(reason)}</span>`).join(" ")}</div>
            <div style="margin-top:6px;display:flex;gap:6px">
              <button class="btn btn-secondary btn-sm" onclick="showMasterDetail('${esc(result.m.mdm_code)}')">查看详情</button>
              ${!STATE.lifecycle.some(item => item.mdm_code === result.m.mdm_code) ? `<button class="btn btn-ghost btn-sm" onclick="createLifecycleFromSearch('${esc(result.m.standard_name)}','${esc(result.m.mdm_code)}')">📋 申请变更</button>` : ""}
            </div>
          </div>
        `).join("")}
      `;
      return true;
    } catch(error){
      $("#searchResult").innerHTML = emptyState("⚠️","检索服务不可用", error.message);
      toast("检索失败：" + error.message, "error");
      return false;
    }
  }

  const candidates = STATE.masters.slice();
  const results = [];
  for(const m of candidates){
    let score = 0;
    const reasons = [];
    const text = `${m.standard_name || ""} ${m.category || ""} ${m.model || ""} ${m.brand || ""} ${m.dn || ""} ${m.pressure || ""} ${m.material || ""}`.toLowerCase();

    // 排除条件：包含排除词则跳过
    if(excludeFilters.length){
      const hasExclude = excludeFilters.some(e => text.includes(e.toLowerCase()) || (m.standard_name || "").toLowerCase().includes(e.toLowerCase()));
      if(hasExclude) continue;
    }

    // AND/OR 模式匹配计数
    let matchCount = 0;
    let totalConditions = 0;

    // 结构化条件加分
    if(modelFilter && m.model){
      totalConditions++;
      if(modelFilter.toUpperCase() === (m.model || "").toUpperCase()){ score += 0.5; reasons.push("型号一致"); matchCount++; }
    }
    if(brandFilter && m.brand){
      totalConditions++;
      if(brandFilter.toLowerCase() === (m.brand || "").toLowerCase()){ score += 0.25; reasons.push("品牌一致"); matchCount++; }
    }
    if(dnFilter && m.dn){
      totalConditions++;
      if(dnFilter === m.dn){ score += 0.2; reasons.push("口径一致"); matchCount++; }
    }
    if(dnMin !== null && dnMax !== null && m.dn){
      totalConditions++;
      const dnVal = parseFloat(m.dn);
      if(!isNaN(dnVal) && dnVal >= dnMin && dnVal <= dnMax){ score += 0.2; reasons.push("口径范围内"); matchCount++; }
    }
    if(pressFilter && m.pressure){
      totalConditions++;
      if(pressFilter === m.pressure){ score += 0.2; reasons.push("压力一致"); matchCount++; }
    }
    if(pressMin !== null && pressMax !== null && m.pressure){
      totalConditions++;
      const pVal = parseFloat(m.pressure);
      if(!isNaN(pVal) && pVal >= pressMin && pVal <= pressMax){ score += 0.2; reasons.push("压力范围内"); matchCount++; }
    }
    if(matFilter && m.material){
      totalConditions++;
      if(matFilter === m.material){ score += 0.2; reasons.push("材质一致"); matchCount++; }
    }
    if(catFilter && m.category){
      totalConditions++;
      if(m.category.includes(catFilter) || catFilter.includes(m.category)){ score += 0.3; reasons.push("品类一致"); matchCount++; }
    }
    if(qtyMin !== null && m.source_count){
      totalConditions++;
      if(m.source_count >= qtyMin){ score += 0.1; reasons.push("库存满足"); matchCount++; }
    }

    // OR 条件匹配（任一满足即可）
    if(orFilters.length){
      for(const [left, right] of orFilters){
        if(text.includes(left.toLowerCase()) || text.includes(right.toLowerCase())){
          score += 0.15; reasons.push("多值匹配"); matchCount++; totalConditions++;
        }
      }
    }

    // 最低置信度过滤
    if(minConfidence > 0 && m.confidence && m.confidence < minConfidence) continue;

    // 关键词 + 同义词匹配
    const terms = queryStd.split(/\s+/).filter(Boolean);
    for(const t of terms){
      if(t.length < 2) continue;
      if(text.includes(t)){ score += 0.08; }
    }

    // 字符 n-gram 命中
    const stdChars = (m._ext?.standardName || `${m.standard_name}`).toLowerCase().replace(/\s+/g,"");
    let charHits = 0;
    for(let n=2;n<=3;n++){
      for(let i=0;i<=queryStd.length-n;i++){
        const g = queryStd.substring(i,i+n);
        if(stdChars.includes(g)) charHits++;
      }
    }
    if(charHits > 0){ score += Math.min(0.15, charHits * 0.004); reasons.push("字符 n-gram 命中"); }

    // 模糊匹配额外加分
    if(matchMode === "fuzzy"){
      // 模糊匹配模式下，降低结构化条件门槛，提高关键词权重
      if(score > 0) score = score * 1.2 + 0.05;
    }

    // OR 模式：只要有一个条件满足即可
    if(matchMode === "or" && matchCount === 0 && score <= 0) continue;

    // AND 模式：至少有一个结构化条件 + 关键词
    if(matchMode === "and" && totalConditions > 0 && matchCount === 0) continue;

    if(score > 0) results.push({ m, score: Math.min(score, 0.99), reasons });
  }

  // 去重 + 排序
  const seen = new Set();
  const uniqueResults = [];
  for(const r of results){
    if(!seen.has(r.m.mdm_code)){ seen.add(r.m.mdm_code); uniqueResults.push(r); }
  }
  uniqueResults.sort((a,b) => b.score - a.score);

  const top = uniqueResults.slice(0, 20);
  if(!top.length){
    $("#searchResult").innerHTML = emptyState("🔍","未找到相似物料","可调整关键词或在「生命周期」中创建新物料申请");
    return;
  }

  // 搜索状态摘要
  const matchModeText = matchMode === "and" ? "全部满足" : matchMode === "or" ? "任一满足" : "模糊匹配";
  const filterSummary = allConditions.length ? `，应用 ${allConditions.length} 个结构化条件（${matchModeText}）` : "";

  $("#searchResult").innerHTML = `
    <div class="search-status">
      <span>🔎 共匹配 <strong style="color:var(--pl)">${uniqueResults.length}</strong> 条主数据，显示 Top ${top.length}</span>
      <span style="color:var(--t3);margin-left:auto">匹配模式: ${matchModeText}${filterSummary}</span>
    </div>
    ${top.map(r => `
      <div class="search-hit">
        <div class="search-hit-head">
          <span class="search-hit-code">${esc(r.m.mdm_code)}</span>
          <span class="search-hit-score" style="color:${r.score>=0.8?'var(--s)':r.score>=0.6?'var(--w)':'var(--t3)'}">${(r.score*100).toFixed(0)}%</span>
        </div>
        <div class="search-hit-name">${esc(r.m.standard_name)}</div>
        <div class="search-hit-meta">${esc(r.m.category || "")} · ${esc(r.m.model || "-")} · ${esc(r.m.brand || "-")} · 来源 ${r.m.source_count || 0} 条</div>
        <div class="search-hit-reason">${r.reasons.map(r => `<span class="tag tag-ok">${esc(r)}</span>`).join(" ")}</div>
        <div style="margin-top:6px;display:flex;gap:6px">
          <button class="btn btn-secondary btn-sm" onclick="showMasterDetail('${esc(r.m.mdm_code)}')">查看详情</button>
          ${!STATE.lifecycle.some(l => l.mdm_code === r.m.mdm_code) ? `<button class="btn btn-ghost btn-sm" onclick="createLifecycleFromSearch('${esc(r.m.standard_name)}','${esc(r.m.mdm_code)}')">📋 申请变更</button>` : ""}
        </div>
      </div>
    `).join("")}
  `;
}

async function decideReview(reviewId, action){
  const review = STATE.reviews.find(item => String(item.id) === String(reviewId));
  if(!review) return;
  try {
    const payload = await apiRequest(`/reviews/${review.id}`, {
      method:"PATCH",
      body:JSON.stringify({ action })
    });
    await syncServerState(payload, true);
    const messages = {
      MERGE:"已合并到主数据 ", NEW:"已确认为新建主数据 ", SKIP:"已忽略审核项 "
    };
    toast(messages[action] + review.mdm_code, action === "SKIP" ? "info" : "success");
    render();
  } catch(error){
    toast("审核操作失败：" + error.message, "error");
  }
}

function lifecycleCard(r, canApprove=false){
  const statusMap = {
    "PENDING": { tag:"tag-warn", text:"待初审" },
    "REVIEWED": { tag:"tag-info", text:"待终审" },
    "APPROVED": { tag:"tag-ok", text:"已批准" },
    "REJECTED": { tag:"tag-err", text:"已退回" },
    "ARCHIVED": { tag:"tag-muted", text:"已归档" }
  };
  const lifecycleStatus = String(r.status || "PENDING").toUpperCase();
  const s = statusMap[lifecycleStatus] || { tag:"tag-muted", text: lifecycleStatus };
  let actions = "";
  if(canApprove){
    if(lifecycleStatus === "PENDING"){
      actions = `<div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn btn-success btn-sm" onclick="lcReview('${r.id}','REVIEWED')">✓ 初审通过</button>
        <button class="btn btn-danger btn-sm" onclick="lcReview('${r.id}','REJECTED')">✗ 退回</button>
      </div>`;
    } else if(lifecycleStatus === "REVIEWED"){
      actions = `<div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn btn-success btn-sm" onclick="lcReview('${r.id}','APPROVED')">✓ 终审批准</button>
        <button class="btn btn-danger btn-sm" onclick="lcReview('${r.id}','REJECTED')">✗ 驳回</button>
      </div>`;
    }
  }
  if(!canApprove && STATE.currentRole === "申请人" && lifecycleStatus === "PENDING"){
    actions = `<div style="margin-top:8px"><button class="btn btn-primary btn-sm" onclick="switchRole('数据管理员')">前往数据管理员初审 →</button></div>`;
  } else if(!canApprove && STATE.currentRole === "申请人" && lifecycleStatus === "REVIEWED"){
    actions = `<div style="margin-top:8px"><button class="btn btn-primary btn-sm" onclick="switchRole('审批人')">前往审批人终审 →</button></div>`;
  }
  if(lifecycleStatus === "APPROVED"){
    const archiveAction = ["数据管理员","审批人"].includes(STATE.currentRole)
      ? `<button class="btn btn-ghost btn-sm" onclick="lcArchive('${r.id}')">📦 归档</button>` : "";
    actions = `<div style="display:flex;gap:6px;margin-top:8px">
      <button class="btn btn-warn btn-sm" onclick="lcChange('${r.id}')">📝 发起变更</button>
      ${archiveAction}
    </div>`;
  }
  return `
    <div class="review-card">
      <div class="review-head">
        <div class="review-meta">
          <div class="review-code">${esc(r.request_id || r.id)} · ${esc(r.mdm_code || "")}</div>
          <div class="review-name">${esc(r.name)}</div>
          <div style="font-size:11px;color:var(--t3)">品类：${esc(r.category)} · 品牌：${esc(r.brand || "-")} · 型号：${esc(r.model || "-")}</div>
          <div style="font-size:11px;color:var(--t2);margin-top:4px">理由：${esc(r.reason || "")}</div>
          ${r.description ? `<div style="font-size:11px;color:var(--t2);margin-top:4px">描述：${esc(r.description)}</div>` : ""}
          <div style="font-size:10px;color:var(--t3);margin-top:4px">申请人：${esc(r.creator)} · 创建：${fmtDate(r.created_at)} ${r.reviewed_at ? `· 处理：${fmtDate(r.reviewed_at)}` : ""}</div>
        </div>
        <div class="review-conf"><span class="tag ${s.tag}">${s.text}</span></div>
      </div>
      ${actions}
    </div>
  `;
}

window.submitLifecycle = async function(){
  const name = $("#lcName").value.trim();
  const category = $("#lcCategory").value;
  const reason = $("#lcReason").value.trim();
  if(!name || !category || !reason){ toast("请填写名称、品类和理由", "warn"); return; }
  const rec = {
    request_id: "REQ-" + Date.now().toString(36).toUpperCase(),
    batch_id: STATE.currentBatch?.batch_id || "",
    mdm_code: "NEW-" + Date.now().toString(36).toUpperCase(),
    name, category,
    brand: $("#lcBrand").value.trim(),
    model: $("#lcModel").value.trim(),
    description: $("#lcDesc").value.trim(),
    reason,
    status: "PENDING",
    creator: "申请人"
  };
  try {
    await apiRequest("/lifecycle", { method:"POST", body:JSON.stringify(rec) });
    await loadServerState();
    toast("申请已提交，等待初审", "success");
    $("#lcName").value = ""; $("#lcCategory").value = ""; $("#lcBrand").value = ""; $("#lcModel").value = ""; $("#lcDesc").value = ""; $("#lcReason").value = "";
    render();
  } catch(error){ toast("申请提交失败：" + error.message, "error"); }
};

window.lcReview = async function(id, action){
  const r = STATE.lifecycle.find(x => String(x.id) === String(id));
  if(!r) return;
  try {
    const payload = await apiRequest(`/lifecycle/${r.id}`, {
      method:"PATCH", body:JSON.stringify({ status:action, reviewer:STATE.currentRole })
    });
    await syncServerState(payload, true);
    toast("操作完成", "success");
    render();
  } catch(error){ toast("流程处理失败：" + error.message, "error"); }
};

window.lcChange = async function(id){
  const r = STATE.lifecycle.find(x => String(x.id) === String(id));
  if(!r) return;
  const newDesc = prompt("请输入变更说明：", "根据现场反馈调整描述");
  if(!newDesc) return;
  const change = { request_id:"REQ-" + Date.now().toString(36).toUpperCase(), batch_id:r.batch_id, mdm_code:r.mdm_code, name:r.name, category:r.category, brand:r.brand, model:r.model, description:newDesc, reason:`变更：${newDesc}`, creator:STATE.currentRole, change_of:r.request_id };
  try {
    await apiRequest("/lifecycle", { method:"POST", body:JSON.stringify(change) });
    await loadServerState();
    toast("变更申请已提交", "success");
    render();
  } catch(error){ toast("变更申请失败：" + error.message, "error"); }
};

window.lcArchive = async function(id){
  const r = STATE.lifecycle.find(x => String(x.id) === String(id));
  if(!r) return;
  if(!confirm("确定要归档该申请吗？")) return;
  try {
    const payload = await apiRequest(`/lifecycle/${r.id}`, {
      method:"PATCH", body:JSON.stringify({ status:"ARCHIVED", reviewer:STATE.currentRole })
    });
    await syncServerState(payload, true);
    toast("已归档", "info");
    render();
  } catch(error){ toast("归档失败：" + error.message, "error"); }
};

/* ===================== 渲染：分发中心 ===================== */
const PLANT_NAMES = { GROUP:"集团总部", SHANGHAI:"上海工厂", BEIJING:"北京工厂" };

function masterAvailableToPlant(master, plantCode){
  if(plantCode === "GROUP") return true;
  const codes = new Set(String(master.plant_codes || "GROUP").split(",").map(value => value.trim()).filter(Boolean));
  return codes.has("GROUP") || codes.has(plantCode);
}

function canonicalTargetSystem(source){
  const value = String(source || "").trim();
  const upper = value.toUpperCase();
  if(upper.includes("SAP") || upper === "ERP") return "SAP系统";
  if(upper.includes("EAM")) return "EAM系统";
  if(upper.includes("MES")) return "MES系统";
  if(upper.includes("WMS") || value.includes("仓储") || value.includes("仓库")) return "WMS仓库";
  if(value.includes("采购")) return "采购平台";
  return value;
}

window.inspectGraphNode = function(nodeId){
  const graph = STATE.graphData || { nodes:[], edges:[] };
  const node = (graph.nodes || []).find(item => item.id === nodeId);
  if(!node) return;
  const relations = (graph.edges || []).filter(edge => edge.source === nodeId || edge.target === nodeId).map(edge => {
    const neighborId = edge.source === nodeId ? edge.target : edge.source;
    const neighbor = (graph.nodes || []).find(item => item.id === neighborId) || { label:neighborId, node_type:"UNKNOWN" };
    return { relation:edge.relation || "RELATED_TO", neighbor };
  });
  showModal(`<div class="modal-title"><span>图谱节点 · ${esc(node.label || node.entity_id || node.id)}</span><span class="close">×</span></div>
    <div class="agent-result" style="margin-top:0">节点类型：<strong>${esc(node.node_type || "-")}</strong> · 中心度：${Number(node.centrality || 0).toFixed(4)} · 直接关系：${relations.length}</div>
    <div style="display:grid;gap:6px;margin-top:12px">${relations.map(item => `<div class="vector-hit"><span class="tag tag-info">${esc(item.relation)}</span> <strong style="margin-left:6px">${esc(item.neighbor.label || item.neighbor.entity_id || item.neighbor.id)}</strong><div style="color:var(--t3);margin-top:3px">${esc(item.neighbor.node_type || "UNKNOWN")}</div></div>`).join("") || `<div style="color:var(--t3)">无直接关系</div>`}</div>`);
};

/* ===================== SVG 图表 ===================== */
function chartDonut(id, items){
  const total = items.reduce((s,x) => s + x.value, 0) || 1;
  const cx = 90, cy = 90, r = 60, ir = 42;
  let acc = 0;
  const gradDefs = items.map((it, i) => `<linearGradient id="grad-${id}-${i}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${it.color}" stop-opacity="0.95"/><stop offset="100%" stop-color="${it.color}" stop-opacity="0.65"/></linearGradient>`).join("");
  const paths = items.map((it, i) => {
    if(!it.value) return "";
    const a0 = acc / total * Math.PI * 2 - Math.PI / 2;
    const a1 = (acc + it.value) / total * Math.PI * 2 - Math.PI / 2;
    acc += it.value;
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const x2 = cx + ir * Math.cos(a1), y2 = cy + ir * Math.sin(a1);
    const x3 = cx + ir * Math.cos(a0), y3 = cy + ir * Math.sin(a0);
    const d = `M${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${ir},${ir} 0 ${large} 0 ${x3},${y3} Z`;
    return `<path d="${d}" fill="url(#grad-${id}-${i})" stroke="var(--bg2)" stroke-width="2" style="filter:drop-shadow(0 1px 3px rgba(0,0,0,.25))"/>`;
  }).join("");
  return `<svg class="chart-svg" viewBox="0 0 180 180" id="${id}">
    <defs>${gradDefs}
      <radialGradient id="grad-${id}-center" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="var(--bg2)" stop-opacity="1"/>
        <stop offset="100%" stop-color="var(--bg)" stop-opacity="1"/>
      </radialGradient>
    </defs>
    ${paths}
    <circle cx="${cx}" cy="${cy}" r="${ir - 2}" fill="url(#grad-${id}-center)"/>
    <text x="${cx}" y="${cy - 4}" text-anchor="middle" fill="var(--t2)" font-size="10">总数</text>
    <text x="${cx}" y="${cy + 16}" text-anchor="middle" fill="var(--t)" font-size="22" font-weight="800">${total}</text>
  </svg>
  <div class="chart-legend">${items.map(it => `<div class="lg"><span class="lg-dot" style="background:${it.color}"></span>${esc(it.name)} <strong style="color:var(--t);margin-left:3px">${it.value}</strong> <span style="color:var(--t3)">(${total?(it.value/total*100).toFixed(0):0}%)</span></div>`).join("")}</div>`;
}

function chartBar(id, items, title, opts={}){
  const color = opts.color || "#3b82f6";
  if(!items.length) return `<svg class="chart-svg" viewBox="0 0 400 200"><text x="200" y="100" text-anchor="middle" fill="var(--t3)" font-size="12">暂无数据</text></svg>`;
  const horizontal = !!opts.horizontal;
  const max = Math.max(...items.map(i => i.value), 1);
  const gradId = "grad-" + id;
  // 品类名较长时统一用横向条形图，避免竖排标签挤在一起
  if(horizontal || items.some(it => String(it.name || "").length > 4)){
    const w = 420, rowH = 26, gap = 8, padX = 110, padY = 8, rightPad = 48;
    const h = Math.max(padY * 2 + items.length * (rowH + gap), 180);
    const barMax = w - padX - rightPad;
    const bars = items.map((it, i) => {
      const y = padY + i * (rowH + gap);
      const bw = Math.max(4, (it.value / max) * barMax);
      const label = String(it.name || "");
      // 完整显示品类名，最多 8 个汉字
      const show = label.length > 8 ? label.slice(0, 8) + "…" : label;
      return `
        <text x="${padX - 10}" y="${y + rowH/2 + 4}" text-anchor="end" fill="var(--t2)" font-size="12" font-weight="600">${esc(show)}</text>
        <rect x="${padX}" y="${y + 3}" width="${bw}" height="${rowH - 6}" fill="url(#${gradId})" rx="5"/>
        <text x="${padX + bw + 8}" y="${y + rowH/2 + 4}" fill="var(--t)" font-size="12" font-weight="700">${it.value}</text>
      `;
    }).join("");
    return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" id="${id}" preserveAspectRatio="xMidYMid meet" style="min-height:${Math.min(h, 320)}px">
      <defs><linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="${color}" stop-opacity="0.95"/><stop offset="100%" stop-color="${color}" stop-opacity="0.55"/></linearGradient></defs>
      ${bars}
    </svg>`;
  } else {
    // 短标签才用纵向柱状图（如数据源 SAP/EAM）
    const w = 360, h = 190, padding = { top: 22, right: 16, bottom: 36, left: 32 };
    const innerW = w - padding.left - padding.right;
    const innerH = h - padding.top - padding.bottom;
    const barCount = items.length;
    const slot = innerW / barCount;
    const barW = slot * 0.55;
    const gap = slot * 0.45;
    const yTicks = 3;
    const gridLines = Array.from({length: yTicks + 1}, (_, i) => {
      const y = padding.top + innerH - (i / yTicks) * innerH;
      const val = Math.round((max * i) / yTicks);
      return `
        <line x1="${padding.left}" y1="${y}" x2="${w - padding.right}" y2="${y}" stroke="var(--bd)" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>
        <text x="${padding.left - 6}" y="${y + 3}" text-anchor="end" fill="var(--t3)" font-size="10">${val}</text>
      `;
    }).join("");
    const bars = items.map((it, i) => {
      const x = padding.left + i * slot + gap/2;
      const bh = (it.value / max) * innerH;
      const y = padding.top + innerH - bh;
      const label = String(it.name || "");
      return `
        <defs>
          <linearGradient id="${gradId}-${i}" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="${color}" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="${color}" stop-opacity="0.55"/>
          </linearGradient>
        </defs>
        <rect x="${x}" y="${y}" width="${barW}" height="${bh}" fill="url(#${gradId}-${i})" rx="4" style="filter:drop-shadow(0 1px 3px rgba(0,0,0,.2))"/>
        <text x="${x + barW/2}" y="${y - 6}" text-anchor="middle" fill="var(--t)" font-size="12" font-weight="800">${it.value}</text>
        <text x="${x + barW/2}" y="${h - padding.bottom + 16}" text-anchor="middle" fill="var(--t2)" font-size="11" font-weight="600">${esc(label)}</text>
      `;
    }).join("");
    return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" id="${id}" preserveAspectRatio="xMidYMid meet">
      ${gridLines}
      ${bars}
    </svg>`;
  }
}

function qualityRadarSVG(){
  const qr = STATE.qualityReport;
  if(!qr){ return `<svg class="chart-svg" viewBox="0 0 360 300" style="min-height:280px"><text x="180" y="150" text-anchor="middle" fill="var(--t3)" font-size="14">暂无质量数据</text></svg>`; }
  const o = qr.overall || {};
  const dims = [
    { name:"完整性", value: o.completeness || 0 },
    { name:"准确性", value: o.accuracy || 0 },
    { name:"一致性", value: o.consistency || 0 },
    { name:"覆盖率", value: Math.min(100, STATE.masters.length * 3) },
    { name:"及时性", value: STATE.reviews.length === 0 ? 100 : Math.max(0, 100 - STATE.reviews.length * 8) }
  ];
  // 放大画布与半径，标签/数值外推，避免重叠
  const cx = 180, cy = 150, R = 92;
  const angle = (i) => (i / dims.length) * Math.PI * 2 - Math.PI / 2;
  const grids = [0.25, 0.5, 0.75, 1].map(s => {
    const pts = dims.map((_, i) => {
      const x = cx + R * s * Math.cos(angle(i));
      const y = cy + R * s * Math.sin(angle(i));
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(" ");
    return `<polygon points="${pts}" fill="none" stroke="var(--bd)" stroke-width="1.2" opacity="0.65"/>`;
  }).join("");
  // 维度名称放在更外侧
  const labels = dims.map((d, i) => {
    const a = angle(i);
    const x = cx + (R + 28) * Math.cos(a);
    const y = cy + (R + 28) * Math.sin(a);
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" fill="var(--t2)" font-size="13" font-weight="700" dy="4">${esc(d.name)}</text>`;
  }).join("");
  const dataPts = dims.map((d, i) => {
    const r = R * (d.value / 100);
    return `${(cx + r * Math.cos(angle(i))).toFixed(1)},${(cy + r * Math.sin(angle(i))).toFixed(1)}`;
  }).join(" ");
  const dataCircles = dims.map((d, i) => {
    const r = R * (d.value / 100);
    const x = cx + r * Math.cos(angle(i));
    const y = cy + r * Math.sin(angle(i));
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="#3b82f6" stroke="var(--bg)" stroke-width="2"/>`;
  }).join("");
  // 数值贴在数据点内侧一点，与外侧名称错开
  const valueLabels = dims.map((d, i) => {
    const a = angle(i);
    const r = Math.min(R * (d.value / 100) + 18, R + 8);
    const x = cx + r * Math.cos(a);
    const y = cy + r * Math.sin(a);
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="800" dy="4">${Math.round(d.value)}</text>`;
  }).join("");
  return `<svg class="chart-svg" viewBox="0 0 360 300" preserveAspectRatio="xMidYMid meet" style="min-height:280px;width:100%">
    <defs>
      <radialGradient id="grad-radar" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.12"/>
      </radialGradient>
    </defs>
    ${grids}
    ${labels}
    <polygon points="${dataPts}" fill="url(#grad-radar)" stroke="#3b82f6" stroke-width="2.5" style="filter:drop-shadow(0 2px 8px rgba(59,130,246,.45))"/>
    ${dataCircles}
    ${valueLabels}
  </svg>
  <div class="chart-legend" style="margin-top:10px"><div class="lg"><span class="lg-dot" style="background:#3b82f6"></span>本批次综合评分 <strong style="color:var(--t);margin-left:3px;font-size:14px">${Math.round(o.score || 0)}%</strong></div></div>`;
}

/* ===================== 主渲染 ===================== */
function render(){
  const pages = {
    home: renderHome(),
    dash: renderDash(),
    kb: renderKB(),
    ingest: renderIngest(),
    search: renderSearch(),
    review: renderReview(),
    quality: renderQuality(),
    lifecycle: renderLifecycle(),
    distribute: renderDistribute()
  };
  let html = pages[STATE.currentPage] || pages.home;
  // 给所有 .page 加上 on class（页面切换由 app.innerHTML 重置）
  html = html.replace(/<div class="page">/g, '<div class="page on">');
  $("#app").innerHTML = html;
  bindIngestZone();
  bindIngestActions();
}

function bindIngestZone(){
  const upZone = $("#upZone");
  if(!upZone) return;
  const fi = $("#csvFile");
  fi.addEventListener("change", (e) => { if(e.target.files[0]) handleCSVFile(e.target.files[0]); });
  upZone.addEventListener("dragover", (e) => { e.preventDefault(); upZone.classList.add("drag"); });
  upZone.addEventListener("dragleave", () => upZone.classList.remove("drag"));
  upZone.addEventListener("drop", (e) => {
    e.preventDefault(); upZone.classList.remove("drag");
    const file = e.dataTransfer.files[0];
    if(file) handleCSVFile(file);
  });
}

function bindIngestActions(){
  const backBtn = $("#backToUpload");
  if(backBtn) backBtn.addEventListener("click", () => { $("#governanceSection").style.display="none"; $("#mappingSection").style.display="none"; });
  const applyBtn = $("#applyMappingBtn");
  if(applyBtn) applyBtn.addEventListener("click", () => applyMappingAndGovern());
}

function switchPage(name){
  STATE.currentPage = name;
  $$(".tab").forEach(t => t.classList.toggle("on", t.dataset.page === name));
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.addEventListener("DOMContentLoaded", () => {
  $$(".tab").forEach(t => t.addEventListener("click", () => switchPage(t.dataset.page)));
  loadServerState()
    .catch(async err => {
      STATE.backendOnline = false;
      console.error("Flask backend unavailable:", err);
      await loadAll();
      toast("Flask 后端不可用，当前仅显示上次缓存。请通过 start.bat 启动平台。", "warn", 6000);
      scheduleBackendReconnect();
    })
    .finally(() => {
      try {
        render();
      } catch(err) {
        console.error("render failed:", err);
        const app = document.getElementById("app");
        if(app){
          app.innerHTML = `<div class="page on"><div class="card"><div class="empty">
            <div class="ic">⚠️</div>
            <div class="title">页面渲染失败</div>
            <div class="desc">${String(err && err.message ? err.message : err)}<br/>请点击左下角「清空」后刷新重试</div>
          </div></div></div>`;
        }
        toast("页面渲染失败：" + (err && err.message ? err.message : err), "error");
      }
    });
});

/* ===================== 数据管理工具 ===================== */
window.exportAllBackup = async function(){
  const data = {
    schema: "ai-mdm-enterprise-demo-v1",
    exported_at: new Date().toISOString(),
    batches: await dbAll("batches"),
    records: await dbAll("records"),
    masters: await dbAll("masters"),
    mappings: await dbAll("mappings"),
    reviews: await dbAll("reviews"),
    qualityReports: await dbAll("qualityReports"),
    searchHistory: await dbAll("searchHistory"),
    lifecycle: await dbAll("lifecycle"),
    distributionLogs: await dbAll("distributionLogs"),
    canonicalMasters: await dbAll("canonicalMasters"),
    settings: await dbAll("settings")
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "ai-mdm-backup-" + Date.now() + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("已导出完整备份", "success");
};

window.importBackup = function(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if(!data.schema) throw new Error("备份文件格式无效");
      for(const store of STORES){
        if(!data[store]) continue;
        await dbClear(store);
        for(const row of data[store]) await dbPut(store, row);
      }
      const restoredBatches = Array.isArray(data.batches) ? [...data.batches] : [];
      restoredBatches.sort((a,b) => Number(b.created_at || 0) - Number(a.created_at || 0));
      if(restoredBatches[0]?.batch_id) activateBatch(restoredBatches[0].batch_id);
      toast("已恢复备份数据，正在刷新", "success");
      setTimeout(() => location.reload(), 800);
    } catch(err){
      toast("备份恢复失败：" + err.message, "error");
    }
  };
  reader.readAsText(file);
};

window.clearAllData = async function(){
  if(!confirm("确定清空 Flask 数据库与本地缓存？此操作不可恢复。")) return;
  if(!confirm("再次确认：将删除全部批次、主数据、审核、生命周期和分发日志。")) return;
  try {
    await apiRequest("/data", { method:"DELETE", body:JSON.stringify({ confirm:"DELETE_ALL_DATA" }) });
    for(const s of STORES) await dbClear(s);
    deactivateBatch();
    resetBatchState();
    STATE.mdmCounters = {}; STATE.distributionPlant = "GROUP"; STATE.distributionMode = "FULL"; STATE.distributionTargets = [];
    updateEngineStatus();
    render();
    toast("已清空 SQLite 数据与页面缓存", "info");
  } catch(error){ toast("清空数据失败：" + error.message, "error"); }
};

</script>

<div class="data-tools">
  <button class="btn btn-secondary btn-sm" onclick="exportAllBackup()">⬇ 导出缓存</button>
  <button class="btn btn-ghost btn-sm" onclick="clearAllData()">清空全部</button>
</div>
